     *   - push a { tone, text, priority } object; `**bold**` marks emphasis
     *   - tone drives the colour of the left rule: good | warn | bad | neutral
     *   - priority sorts them; only the top few are shown
     *   - a rule that has nothing useful to say must return nothing, not filler
     *
     * A future LLM-backed coach would implement the same
     * `insights(): Insight[]` signature, so the dashboard wouldn't change.
     */
    
    
    /**
     * @typedef {Object} Insight
     * @property {'good'|'warn'|'bad'|'neutral'} tone
     * @property {string} text      may contain **bold** spans
     * @property {number} priority  higher shows first
     */
    
    /** Generate the ranked insight list. @returns {Insight[]} */
    function insights(today = dayKey(), limit = 4) {
      const week = lastNDays(7, today);
      const loggedDays = week.filter((k) => store.day(k).entries.length > 0);
      const out = [];
    
      const push = (tone, text, priority) => out.push({ tone, text, priority });
    
      /* --- Not enough data yet ------------------------------------------------
         An empty coach panel is a dead end. Say what to do instead.           */
      if (loggedDays.length === 0) {
        push('neutral', 'Log your first meal and this panel starts reading your numbers back to you.', 100);
        return out;
      }
    
      const goals = store.goals();
    
      /* --- 1. Protein average this week --------------------------------------- */
      const avgProtein = nutrition.averageMacro(week, 'protein');
      if (loggedDays.length >= 2) {
        const gap = Math.round(avgProtein - goals.protein);
        if (gap >= 0) {
          push('good', `You're averaging **${grams(avgProtein)} g protein** this week — ${signed(gap, 0)} g against your goal.`, 90);
        } else {
          push('warn', `You're averaging **${grams(avgProtein)} g protein** this week, **${grams(-gap)} g short** of your ${goals.protein} g goal.`, 92);
        }
      }
    
      /* --- 2. Goal hit rate ---------------------------------------------------- */
      if (loggedDays.length >= 3) {
        const hits = nutrition.daysHittingGoal(week, 'protein');
        const tone = hits >= loggedDays.length - 1 ? 'good' : hits <= 1 ? 'bad' : 'warn';
        push(tone, `You hit your protein goal **${hits} of ${loggedDays.length}** logged days this week.`, 80);
      }
    
      /* --- 3. Weekend pattern -------------------------------------------------
         Only fires with enough of both kinds of day for the comparison to mean
         anything, and only when the gap is large enough to act on.            */
      const fortnight = lastNDays(14, today).filter((k) => store.day(k).entries.length > 0);
      const weekdays = fortnight.filter((k) => !isWeekend(k));
      const weekends = fortnight.filter((k) => isWeekend(k));
      if (weekdays.length >= 3 && weekends.length >= 2) {
        const wd = nutrition.averageMacro(weekdays, 'protein');
        const we = nutrition.averageMacro(weekends, 'protein');
        const gap = Math.round(wd - we);
        if (gap >= 15) {
          push('warn', `Weekends cost you protein: **${grams(we)} g** on Sat/Sun against **${grams(wd)} g** on weekdays.`, 70);
        } else if (gap <= -15) {
          push('good', `Your weekends are your strongest protein days — **${grams(we)} g** against **${grams(wd)} g** midweek.`, 60);
        }
      }
    
      /* --- 4. Weight trend ----------------------------------------------------- */
      const monthly = weight.monthlyChange(today);
      if (monthly !== null && Math.abs(monthly) >= 0.2) {
        const dir = monthly < 0 ? 'down' : 'up';
        push(monthly < 0 ? 'good' : 'neutral',
          `Your weight is **${dir} ${kg(Math.abs(monthly))} kg** over the last month.`, 75);
      } else {
        const weekly = weight.weeklyChange(today);
        if (weekly !== null && Math.abs(weekly) >= 0.3) {
          const dir = weekly < 0 ? 'down' : 'up';
          push('neutral', `Your weight is **${dir} ${kg(Math.abs(weekly))} kg** this week.`, 55);
        }
      }
    
      /* --- 5. Stale weigh-in --------------------------------------------------- */
      const sinceWeigh = weight.daysSinceLastEntry(today);
      if (sinceWeigh === null) {
        push('neutral', 'Add a weight and the trend chart starts working.', 50);
      } else if (sinceWeigh >= 7) {
        push('warn', `Last weigh-in was **${sinceWeigh} days ago**. The trend needs a fresh reading.`, 52);
      }
    
      /* --- 6. Calories vs goal this week --------------------------------------- */
      if (loggedDays.length >= 3) {
        const avgCal = nutrition.averageMacro(week, 'calories');
        const diff = Math.round(avgCal - goals.calories);
        if (Math.abs(diff) >= 150) {
          const over = diff > 0;
          push(over ? 'warn' : 'neutral',
            `You're averaging **${int(avgCal)} kcal** a day, ${int(Math.abs(diff))} ${over ? 'over' : 'under'} your ${int(goals.calories)} goal.`, 72);
        } else {
          push('good', `Calories are steady — **${int(avgCal)} kcal** a day against a ${int(goals.calories)} goal.`, 45);
        }
      }
    
      /* --- 7. What's left today ------------------------------------------------
         The only forward-looking rule, and the one most likely to change what
         the user does in the next hour. Ranked highest for that reason.      */
      const todayTotals = nutrition.totalsFor(today);
      // Branch on the raw shortfall, not the rounded one. `remaining()` rounds, so
      // 149.6 g against a 150 g goal gives 0 — which used to fail the "> 0" test
      // and the ">= goal" test both, making the top-priority insight vanish
      // exactly when the user was closest to their target.
      const proteinShortfall = goals.protein - todayTotals.protein;
      if (goals.protein > 0 && todayTotals.calories > 0) {
        if (proteinShortfall >= 0.5) {
          const left = nutrition.remaining(todayTotals.protein, goals.protein);
          const suggestion = closestFoodFor(left);
          push('neutral',
            suggestion
              ? `**${grams(left)} g protein left** today — about ${suggestion}.`
              : `**${grams(left)} g protein left** today.`, 95);
        } else {
          push('good', `Protein goal already met today — **${grams(todayTotals.protein)} g**.`, 95);
        }
      }
    
      /* --- 8. Streak ----------------------------------------------------------- */
      const streak = currentStreak(today);
      if (streak >= 3) {
        const best = bestStreak();
        push('good', streak >= best && best > 3
          ? `**${streak} days** logged in a row — your longest run yet.`
          : `**${streak} days** logged in a row.`, 40);
      }
    
      /* --- 9. Steps ------------------------------------------------------------ */
      const stepDays = week.filter((k) => typeof store.day(k).steps === 'number');
      if (stepDays.length >= 3 && goals.steps > 0) {
        const avg = Math.round(stepDays.reduce((s, k) => s + store.day(k).steps, 0) / stepDays.length);
        const hit = avg >= goals.steps;
        push(hit ? 'good' : 'neutral',
          `You're averaging **${int(avg)} steps** a day against a ${int(goals.steps)} goal.`, 35);
      }
    
      return out.sort((a, b) => b.priority - a.priority).slice(0, limit);
    }
    
    /**
     * Describe the protein gap in food the user actually eats, e.g. "3 × Egg".
     * Returns null if nothing in their database gets close, rather than
     * inventing a food.
     *
     * Food names are printed verbatim — they're user-entered and often brand
     * names ("Akshayakalpa Milk"), so lower-casing or pluralising them produces
     * copy that reads as broken.
     */
    function closestFoodFor(proteinGrams) {
      const candidates = store.foods()
        .filter((f) => f.protein >= 5 && f.pinned !== false)
        .map((f) => ({ food: f, servings: Math.round(proteinGrams / f.protein) }))
        .filter((c) => c.servings >= 1 && c.servings <= 6);
    
      if (!candidates.length) return null;
    
      // Prefer the option whose whole-serving count lands nearest the gap.
      candidates.sort((a, b) =>
        Math.abs(a.servings * a.food.protein - proteinGrams) -
        Math.abs(b.servings * b.food.protein - proteinGrams));
    
      const { food, servings } = candidates[0];
      return `${servings} × ${food.name}`;
    }
    return { insights };
  })();

  /* ============================================================
     js/ui/icons.js
     ============================================================ */
  const { icons, icon } = (() => {
    /**
     * icons.js — inline SVG glyphs for the tab bar and rows.
     *
     * Inline rather than an icon font or sprite sheet: five icons don't justify
     * a network request, and inline paths inherit `currentColor`, which is how
     * the active tab tints itself.
     *
     * Drawn on a 24×24 grid with a 1.8px stroke to sit alongside SF Symbols
     * without looking heavier than the system's own icons.
     */

    const svg = (paths, { fill = false } = {}) =>
      `<svg viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="${fill ? 'none' : 'currentColor'}"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;

    const icons = {
      // Concentric arcs — the dashboard's own ring, miniaturised.
      dashboard: svg(`<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/><circle cx="12" cy="12" r="3.5"/>`),

      // Plus in a rounded square: the add action.
      log: svg(`<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8.5v7M8.5 12h7"/>`),

      // Calendar.
      history: svg(`<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/>`),

      // Trend line.
      weight: svg(`<path d="M4 16.5l4.5-5 3.5 3 7.5-8"/><path d="M19.5 6.5h-4M19.5 6.5v4"/>`),

      // Sliders.
      settings: svg(`<path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2.2"/><circle cx="9" cy="16" r="2.2"/>`),

      chevron: svg(`<path d="M9 5l7 7-7 7"/>`),
      plus: svg(`<path d="M12 5v14M5 12h14"/>`),
      trash: svg(`<path d="M4 7h16M10 7V5h4v2M6 7l1 13h10l1-13"/>`),
      flame: svg(`<path d="M12 3s5 4.2 5 9a5 5 0 0 1-10 0c0-1.6.8-3 1.6-4 .2 1.2.9 2 1.9 2 1.4 0 2-1.3 2-3 0-1.7-.5-3-.5-4z"/>`),
    };

    /**
     * Turn an icon string into a DOM node.
     *
     * innerHTML is safe here and only here: `name` is used solely as a lookup
     * key into the frozen `icons` map above, so the markup assigned is always
     * one of the literals in this file and never anything a user typed. Nothing
     * else in the app assigns innerHTML — user text always goes through
     * createTextNode in core/dom.js.
     */
    function icon(name) {
      const markup = Object.prototype.hasOwnProperty.call(icons, name) ? icons[name] : '';
      const wrap = document.createElement('span');
      wrap.style.display = 'inline-flex';
      wrap.innerHTML = markup;
      return wrap.firstElementChild || wrap;
    }

    Object.freeze(icons);
    return { icons, icon };
  })();

  /* ============================================================
     js/ui/ring.js
     ============================================================ */
  const { ring, macroRing } = (() => {
    /**
     * ring.js — the progress ring.
     *
     * An SVG circle whose stroke-dasharray is the full circumference and whose
     * stroke-dashoffset encodes progress. Transitioning the offset gives the
     * sweep animation for free, and the browser does it on the compositor.
     *
     * Overshoot is drawn as a second, translucent arc on top of the first rather
     * than clamping at 100% — eating 2,600 against a 2,200 goal should look
     * different from eating exactly 2,200.
     */


    /**
     * @param {Object} opts
     * @param {number} opts.value
     * @param {number} opts.goal
     * @param {string} opts.color      CSS colour (usually a var())
     * @param {number} [opts.size]     px
     * @param {number} [opts.stroke]   px
     * @param {string} [opts.label]    accessible name, e.g. "Protein"
     * @param {Node}   [opts.center]   content to place inside the ring
     * @returns {HTMLElement}
     */
    function ring({ value, goal, color, size = 96, stroke = 10, label = '', center = null }) {
      const radius = (size - stroke) / 2;
      const circumference = 2 * Math.PI * radius;

      const fraction = goal > 0 ? value / goal : 0;
      const primary = Math.min(fraction, 1);
      const overshoot = Math.min(Math.max(fraction - 1, 0), 1);

      const svg = svgEl('svg', {
        class: 'ring',
        width: size,
        height: size,
        viewBox: `0 0 ${size} ${size}`,
        role: 'img',
        'aria-label': `${label}: ${Math.round(value)} of ${Math.round(goal)}, ${Math.round(fraction * 100)} percent`,
      },
        svgEl('circle', {
          class: 'ring__track',
          cx: size / 2, cy: size / 2, r: radius,
          'stroke-width': stroke,
        }),
        svgEl('circle', {
          class: 'ring__arc',
          cx: size / 2, cy: size / 2, r: radius,
          stroke: color,
          'stroke-width': stroke,
          'stroke-dasharray': circumference,
          // Start fully hidden; the value is applied on the next frame so the
          // browser has something to animate from.
          'stroke-dashoffset': circumference,
        }),
        overshoot > 0 && svgEl('circle', {
          class: 'ring__over',
          cx: size / 2, cy: size / 2, r: radius,
          stroke: color,
          'stroke-width': stroke,
          'stroke-dasharray': circumference,
          'stroke-dashoffset': circumference,
          transform: `rotate(-90 ${size / 2} ${size / 2})`,
        }),
      );

      const arcs = svg.querySelectorAll('.ring__arc, .ring__over');
      requestAnimationFrame(() => {
        arcs[0].setAttribute('stroke-dashoffset', circumference * (1 - primary));
        if (arcs[1]) arcs[1].setAttribute('stroke-dashoffset', circumference * (1 - overshoot));
      });

      return el('div.ring-wrap', {}, svg, center && el('div.ring-center', {}, center));
    }

    /**
     * A small ring with its value and label beneath — the dashboard's row of
     * three. The number sits outside the ring because at 64px there isn't room
     * for legible type inside it.
     */
    function macroRing({ value, goal, color, label, unit = 'g', size = 64 }) {
      return el('div.macro-ring', {},
        ring({ value, goal, color, size, stroke: 7, label }),
        el('div.macro-ring__value', {}, `${Math.round(value)}${unit}`),
        el('div.macro-ring__label', {}, `${label} · ${Math.round(goal)}${unit}`),
      );
    }
    return { ring, macroRing };
  })();

  /* ============================================================
     js/ui/chart.js
     ============================================================ */
  const { weightChart, dayBars } = (() => {
    /**
     * chart.js — the weight trend chart.
     *
     * One series, so there is no legend: the card title names it. The line is
     * the smoothed trend (the signal); the dots are the raw weigh-ins (the
     * evidence). Grid is two hairlines at the y-extremes and nothing else —
     * more gridlines would compete with a line that only ever moves a little.
     *
     * Touching or hovering the plot snaps a crosshair to the nearest weigh-in
     * and shows its date and value, so no point needs a permanent label.
     */


    const PAD = { top: 14, right: 10, bottom: 22, left: 34 };

    /**
     * @param {Array<{key:string,value:number}>} raw     weigh-ins, oldest first
     * @param {Array<{key:string,value:number}>} trend   smoothed line, same length
     * @param {Object} [opts]
     * @param {number} [opts.height]
     * @param {string} [opts.unit]
     * @returns {HTMLElement} positioned wrapper containing the svg and tooltip
     */
    function weightChart(raw, trend, { height = 190, unit = 'kg' } = {}) {
      const wrap = el('div.chart-wrap');

      if (raw.length < 2) {
        wrap.append(el('div.empty', {},
          el('strong', {}, raw.length ? 'One weigh-in so far' : 'No weigh-ins yet'),
          'Two readings draw a line. Add today\'s above.'));
        return wrap;
      }

      // The viewBox is a fixed coordinate space; CSS stretches the svg to the
      // card width. Keeps the maths simple and the render crisp at any size.
      const W = 340;
      const H = height;
      const plotW = W - PAD.left - PAD.right;
      const plotH = H - PAD.top - PAD.bottom;

      const values = [...raw.map((p) => p.value), ...trend.map((p) => p.value)];
      let min = Math.min(...values);
      let max = Math.max(...values);
      // A flat week would otherwise divide by zero and draw a line at the top.
      const span = Math.max(max - min, 1);
      min -= span * 0.15;
      max += span * 0.15;

      const x = (i) => PAD.left + (plotW * i) / (raw.length - 1);
      const y = (v) => PAD.top + plotH - ((v - min) / (max - min)) * plotH;

      const linePath = trend.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
      const areaPath = `${linePath} L${x(trend.length - 1).toFixed(1)},${PAD.top + plotH} L${PAD.left},${PAD.top + plotH} Z`;

      const crosshair = svgEl('line', {
        class: 'chart__crosshair',
        y1: PAD.top, y2: PAD.top + plotH,
        x1: 0, x2: 0,
        opacity: 0,
      });
      const marker = svgEl('circle', { class: 'chart__dot', r: 5, opacity: 0, cx: 0, cy: 0 });

      const svg = svgEl('svg', {
        class: 'chart',
        viewBox: `0 0 ${W} ${H}`,
        height,
        preserveAspectRatio: 'none',
        role: 'img',
        'aria-label': `Weight trend, ${raw.length} readings from ${shortDate(raw[0].key)} to ${shortDate(raw[raw.length - 1].key)}`,
      },
        // y extremes only
        svgEl('line', { class: 'chart__grid', x1: PAD.left, x2: W - PAD.right, y1: PAD.top, y2: PAD.top }),
        svgEl('line', { class: 'chart__grid', x1: PAD.left, x2: W - PAD.right, y1: PAD.top + plotH, y2: PAD.top + plotH }),
        svgEl('text', { class: 'chart__label', x: 4, y: PAD.top + 4 }, kg(max)),
        svgEl('text', { class: 'chart__label', x: 4, y: PAD.top + plotH + 4 }, kg(min)),
        svgEl('text', { class: 'chart__label', x: PAD.left, y: H - 6 }, shortDate(raw[0].key)),
        svgEl('text', { class: 'chart__label', x: W - PAD.right, y: H - 6, 'text-anchor': 'end' },
          shortDate(raw[raw.length - 1].key)),

        svgEl('path', { class: 'chart__area', d: areaPath }),
        svgEl('path', { class: 'chart__line', d: linePath }),

        // Raw weigh-ins. Small, and only drawn when they won't collide.
        raw.length <= 45
          ? raw.map((p, i) => svgEl('circle', {
              class: 'chart__dot', cx: x(i), cy: y(p.value), r: 3, opacity: 0.55,
            }))
          : null,

        crosshair,
        marker,
      );

      const tip = el('div.chart-tip', { style: { opacity: 0 } });
      wrap.append(svg, tip);

      /* --- Hover / touch layer ------------------------------------------------
         Snap to the nearest data index rather than interpolating: the user is
         asking "what did I weigh on that day", not "what was the trend at
         x=163.4px".                                                          */
      const showAt = (clientX) => {
        const box = svg.getBoundingClientRect();
        const ratio = (clientX - box.left) / box.width;
        const i = Math.max(0, Math.min(raw.length - 1, Math.round(ratio * (raw.length - 1))));
        const px = x(i);
        const py = y(raw[i].value);

        crosshair.setAttribute('x1', px);
        crosshair.setAttribute('x2', px);
        crosshair.setAttribute('opacity', 1);
        marker.setAttribute('cx', px);
        marker.setAttribute('cy', py);
        marker.setAttribute('opacity', 1);

        tip.textContent = `${shortDate(raw[i].key)} · ${kg(raw[i].value)} ${unit}`;
        tip.style.opacity = '1';
        tip.style.left = `${(px / W) * box.width}px`;
        tip.style.top = `${(py / H) * box.height}px`;
      };

      const hide = () => {
        crosshair.setAttribute('opacity', 0);
        marker.setAttribute('opacity', 0);
        tip.style.opacity = '0';
      };

      svg.addEventListener('pointermove', (e) => showAt(e.clientX));
      svg.addEventListener('pointerdown', (e) => showAt(e.clientX));
      svg.addEventListener('pointerleave', hide);
      svg.addEventListener('pointercancel', hide);

      return wrap;
    }

    /**
     * A four-bar goal-attainment glyph for a day in the history list.
     * Height encodes fraction of goal, capped at 100% — this is a glance
     * indicator, and the exact numbers sit right beside it.
     */
    function dayBars(totals, goals) {
      const bar = (macro, color) => {
        const pct = goals[macro] > 0 ? Math.min(totals[macro] / goals[macro], 1) : 0;
        return el('div.day-bar', {},
          el('div.day-bar__fill', { style: { height: `${Math.round(pct * 100)}%`, background: color } }));
      };
      return el('div.day-bars', { 'aria-hidden': 'true' },
        bar('calories', 'var(--c-calories)'),
        bar('protein', 'var(--c-protein)'),
        bar('carbs', 'var(--c-carbs)'),
        bar('fat', 'var(--c-fat)'),
      );
    }
    return { weightChart, dayBars };
  })();

  /* ============================================================
     js/ui/toast.js
     ============================================================ */
  const { toast } = (() => {
    /**
     * toast.js — transient confirmation, with Undo where the action is reversible.
     *
     * Logging food is one tap, which makes mis-taps cheap to make and annoying to
     * fix. Every add offers Undo for four seconds so a wrong tap costs one more
     * tap, not a trip into the entry list.
     */


    const root = () => document.getElementById('toast-root');

    let active = null;

    /**
     * @param {string} message
     * @param {Object} [opts]
     * @param {() => void} [opts.onUndo]  shows an Undo button when provided
     * @param {number} [opts.duration]    ms
     */
    function toast(message, { onUndo, duration = onUndo ? 4000 : 2000 } = {}) {
      dismiss();

      const node = el('div.toast', { role: 'status' },
        el('span', {}, message),
        onUndo && el('button.toast__undo', {
          type: 'button',
          onclick: () => { onUndo(); dismiss(); },
        }, 'Undo'),
      );

      const timer = setTimeout(dismiss, duration);
      active = { node, timer };
      root().append(node);
    }

    function dismiss() {
      if (!active) return;
      const { node, timer } = active;
      active = null;
      clearTimeout(timer);
      node.classList.add('toast--leaving');
      node.addEventListener('animationend', () => node.remove(), { once: true });
      // Belt and braces: if the animation never fires (reduced motion), remove anyway.
      setTimeout(() => node.remove(), 400);
    }
    return { toast };
  })();

  /* ============================================================
     js/ui/sheet.js
     ============================================================ */
  const { sheet, closeSheet, sheetActions } = (() => {
    /**
     * sheet.js — modal bottom sheet.
     *
     * Used for focused sub-tasks (edit a food, build a template, enter a weight)
     * that shouldn't cost a screen change. Dismissed by the backdrop, the Cancel
     * button, or Escape.
     */


    const root = () => document.getElementById('sheet-root');

    let open = null;

    /**
     * @param {Object} opts
     * @param {string} opts.title
     * @param {Node|Node[]} opts.body
     * @param {() => void} [opts.onClose]
     * @returns {{close: () => void}}
     */
    function sheet({ title, body, onClose }) {
      closeSheet();

      const panel = el('div.sheet', {
        role: 'dialog',
        'aria-modal': 'true',
        'aria-label': title,
        // Taps inside the sheet must not reach the backdrop's close handler.
        onclick: (e) => e.stopPropagation(),
      },
        el('div.sheet__grabber'),
        el('h2.sheet__title', {}, title),
        body,
      );

      const backdrop = el('div.sheet-backdrop', { onclick: () => closeSheet() }, panel);

      const onKey = (e) => { if (e.key === 'Escape') closeSheet(); };
      document.addEventListener('keydown', onKey);

      open = { backdrop, onKey, onClose };
      root().append(backdrop);

      // Focus the first field so the keyboard comes up ready to type.
      requestAnimationFrame(() => panel.querySelector('input, button')?.focus());

      return { close: closeSheet };
    }

    function closeSheet() {
      if (!open) return;
      const { backdrop, onKey, onClose } = open;
      open = null;
      document.removeEventListener('keydown', onKey);
      backdrop.remove();
      onClose?.();
    }

    /**
     * Two-button footer: a primary confirm and a quiet cancel.
     * Every sheet uses this so the action always sits in the same place.
     */
    function sheetActions(confirmLabel, onConfirm, { destructive = false } = {}) {
      return el('div.row', { style: { gap: 'var(--s-3)', marginTop: 'var(--s-5)' } },
        el('button.btn.btn--block', { type: 'button', onclick: () => closeSheet() }, 'Cancel'),
        el(`button.btn.btn--block.${destructive ? 'btn--danger' : 'btn--primary'}`, {
          type: 'button',
          onclick: onConfirm,
        }, confirmLabel),
      );
    }
    return { sheet, closeSheet, sheetActions };
  })();

  /* ============================================================
     js/ui/router.js
     ============================================================ */
  const router = (() => {
    /**
     * router.js — hash routing.
     *
     * The hash (rather than the History API) is deliberate: it works from
     * file://, from a static host with no rewrite rules, and inside an iOS
     * standalone web app where a hard navigation would drop you out of the
     * app shell.
     *
     * A screen module is `{ render(params): Node }`. It is called fresh on every
     * navigation and on every state change, so screens never hold stale data.
     */


    const routes = new Map();
    let current = null;
    let onChange = null;

    /** @param {string} path  e.g. 'dashboard' */
    function route(path, screen) {
      routes.set(path, screen);
    }

    function setOnChange(fn) { onChange = fn; }

    /** The active route name. */
    const currentRoute = () => current?.path ?? 'dashboard';

    /** Navigate. Params become `#/path?key=value`. */
    function go(path, params = {}) {
      const query = new URLSearchParams(params).toString();
      location.hash = `#/${path}${query ? `?${query}` : ''}`;
    }

    function parseHash() {
      const raw = location.hash.replace(/^#\/?/, '');
      const [path, query] = raw.split('?');
      return {
        path: routes.has(path) ? path : 'dashboard',
        params: Object.fromEntries(new URLSearchParams(query || '')),
      };
    }

    /** Render the current route into #app. */
    function render() {
      const { path, params } = parseHash();
      const screen = routes.get(path);
      if (!screen) return;

      const changedScreen = current?.path !== path;
      current = { path, params };

      const app = document.getElementById('app');
      mount(app, screen.render(params));

      // Only jump to the top when the screen itself changed — a re-render caused
      // by logging a food must not throw away the user's scroll position.
      if (changedScreen) window.scrollTo(0, 0);

      onChange?.(path);
    }

    function start() {
      window.addEventListener('hashchange', render);
      if (!location.hash) location.replace('#/dashboard');
      render();
    }
    return { route, setOnChange, currentRoute, go, render, start };
  })();
  const { route, setOnChange, go } = router;
  const renderRoute = router.render;
  const startRouter = router.start;
  const rerender = renderRoute;

  /* ============================================================
     js/ui/nav.js
     ============================================================ */
  const { buildNav, setActiveTab } = (() => {
    /**
     * nav.js — the bottom tab bar.
     *
     * Built once at boot and never re-rendered; navigation only flips the
     * aria-current attribute. That keeps the bar perfectly still while screens
     * change underneath it, which is what makes an installed PWA feel native
     * rather than like a site.
     */


    const TABS = [
      { path: 'dashboard', label: 'Today',   glyph: 'dashboard' },
      { path: 'log',       label: 'Log',     glyph: 'log' },
      { path: 'history',   label: 'History', glyph: 'history' },
      { path: 'weight',    label: 'Weight',  glyph: 'weight' },
      { path: 'settings',  label: 'Settings', glyph: 'settings' },
    ];

    function buildNav() {
      const bar = document.getElementById('tabbar');
      bar.replaceChildren(...TABS.map((tab) =>
        el('button.tab', {
          type: 'button',
          dataset: { path: tab.path },
          'aria-label': tab.label,
          onclick: () => { tapFeedback(); go(tab.path); },
        }, icon(tab.glyph), el('span', {}, tab.label))));
    }

    /** Mark the active tab. Called by the router on every navigation. */
    function setActiveTab(path) {
      for (const tab of document.querySelectorAll('.tab')) {
        if (tab.dataset.path === path) tab.setAttribute('aria-current', 'page');
        else tab.removeAttribute('aria-current');
      }
    }
    return { buildNav, setActiveTab };
  })();

  /* ============================================================
     js/ui/theme.js
     ============================================================ */
  const { applyTheme, watchSystemTheme } = (() => {
    /**
     * theme.js — resolves the user's theme setting into a concrete
     * `data-theme` attribute on <html>.
     *
     * Resolving in JS rather than leaning on a CSS media query is what lets the
     * in-app Light/Dark/System switch take effect on the same frame, and keeps
     * one code path for all three choices.
     */


    const media = window.matchMedia('(prefers-color-scheme: dark)');

    /** Apply the current setting. Safe to call as often as you like. */
    function applyTheme() {
      const choice = store.settings().theme || 'system';
      const dark = choice === 'dark' || (choice === 'system' && media.matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';

      // Keep the iOS status bar and Android chrome in step with the app surface.
      const color = dark ? '#000000' : '#F2F2F7';
      for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
        meta.setAttribute('content', color);
      }
    }

    /** Follow the OS while the setting is 'system'. */
    function watchSystemTheme() {
      media.addEventListener('change', () => {
        if ((store.settings().theme || 'system') === 'system') applyTheme();
      });
    }
    return { applyTheme, watchSystemTheme };
  })();

  /* ============================================================
     js/screens/dashboard.js
     ============================================================ */
  const screenDashboard = (() => {
    /**
     * dashboard.js — today at a glance.
     *
     * Layout intent: exactly one bold element. The calorie ring is large and
     * carries the headline number (calories left); the three macro rings sit
     * quiet beneath it in the same card, and the stat tiles and coach notes are
     * deliberately plain. If everything shouted, nothing would.
     */
    
    
    function render() {
      const today = dayKey();
      const totals = nutrition.totalsFor(today);
      const goals = store.goals();
      const left = nutrition.remaining(totals.calories, goals.calories);
      const over = totals.calories > goals.calories;
    
      return el('div', {},
        el('header.screen-head', {},
          el('div', {},
            el('div.cap', {}, friendlyDate(today)),
            el('h1.screen-title', {}, 'MacroTrack'),
            // Kept at micro weight deliberately: a credit line, not a third
            // heading competing with the date above and the title beside it.
            el('div.byline', {}, 'Designed by Navin'),
          ),
          el('button.btn.btn--sm.btn--primary', {
            type: 'button',
            onclick: () => go('log'),
          }, '+ Log food'),
        ),
    
        heroCard(totals, goals, left, over),
        statRow(today),
        coachCard(today),
      );
    }
    
    /* ------------------------------------------------------------------ hero -- */
    
    function heroCard(totals, goals, left, over) {
      return el('section.card.hero', { 'aria-label': 'Today\'s macros' },
        ring({
          value: totals.calories,
          goal: goals.calories,
          color: 'var(--c-calories)',
          size: 188,
          stroke: 16,
          label: 'Calories',
          center: el('div', { style: { textAlign: 'center' } },
            el('div.hero__center-value.num', {}, over ? int(totals.calories - goals.calories) : int(left)),
            el('div.hero__center-unit', {}, over ? 'kcal over' : 'kcal left'),
          ),
        }),
    
        el('div.hero__eaten', {},
          `${int(totals.calories)} of ${int(goals.calories)} kcal eaten`),
    
        el('div.hero__macros', {},
          macroRing({ value: totals.protein, goal: goals.protein, color: 'var(--c-protein)', label: 'Protein' }),
          macroRing({ value: totals.carbs, goal: goals.carbs, color: 'var(--c-carbs)', label: 'Carbs' }),
          macroRing({ value: totals.fat, goal: goals.fat, color: 'var(--c-fat)', label: 'Fat' }),
        ),
      );
    }
    
    /* ------------------------------------------------------------- stat tiles -- */
    
    function statRow(today) {
      const latest = weight.latest();
      const weekly = weight.weeklyChange(today);
      const steps = readSteps(today);
      const streak = currentStreak(today);
      const stepGoal = store.goals().steps;
    
      return el('div.stat-grid', { style: { marginBottom: 'var(--s-4)' } },
        el('button.stat', { type: 'button', onclick: () => go('weight') },
          el('div.stat__label', {}, 'Weight'),
          el('div.stat__value', {},
            latest ? kg(latest.value) : '—',
            latest && el('span.stat__unit', {}, store.settings().weightUnit)),
          // "Tap to add" under a weight the user can plainly see is contradictory.
          // With a reading but no comparable one a week back, show when it was.
          el('div.micro', {},
            weekly !== null ? `${signed(weekly)} this week`
              : latest ? friendlyDate(latest.key).toLowerCase()
              : 'Tap to add'),
        ),
    
        el('button.stat', { type: 'button', onclick: openStepsSheet },
          el('div.stat__label', {}, 'Steps'),
          el('div.stat__value', {}, steps === null ? '—' : int(steps)),
          el('div.micro', {},
            steps === null ? 'Tap to add' : `goal ${int(stepGoal)}`),
        ),
    
        el('button.stat', { type: 'button', onclick: () => go('history') },
          el('div.stat__label', {}, 'Streak'),
          el('div.stat__value', {}, int(streak), el('span.stat__unit', {}, streak === 1 ? 'day' : 'days')),
          el('div.micro', {}, streak ? 'in a row' : 'log to start'),
        ),
      );
    }
    
    /**
     * Step entry. Lives in a sheet rather than a screen because it is a single
     * number typed once a day.
     */
    function openStepsSheet() {
      tapFeedback();
      const today = dayKey();
    
      if (!stepsAreEditable()) {
        toast('Steps are coming from Apple Health.');
        return;
      }
    
      const input = el('input.input', {
        type: 'number', inputmode: 'numeric', min: '0', step: '100',
        placeholder: 'e.g. 8200',
        value: readSteps(today) ?? '',
      });
    
      const save = () => {
        const raw = input.value.trim();
        store.setSteps(raw === '' ? null : Number(raw), today);
        closeSheet();
        toast(raw === '' ? 'Steps cleared' : `Steps set to ${int(raw)}`);
      };
    
      sheet({
        title: 'Steps today',
        body: el('div', {},
          el('div.field', {},
            el('label.field__label', {}, 'Step count'),
            input,
          ),
          el('p.cap', {}, 'Manual for now. Apple Health can fill this in automatically once the iOS bridge is added.'),
          sheetActions('Save steps', save),
        ),
      });
    
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
    }
    
    /* ----------------------------------------------------------------- coach -- */
    
    function coachCard(today) {
      const notes = insights(today);
      if (!notes.length) return null;
    
      return el('section.card', { 'aria-label': 'AI Coach' },
        el('div.card-head', {},
          el('h2.card-title', {}, 'Coach'),
          el('span.cap', {}, 'from your last 14 days'),
        ),
        notes.map((note) =>
          el('div.insight', {},
            el(`div.insight__mark${note.tone === 'warn' ? '.insight__mark--warn' : note.tone === 'bad' ? '.insight__mark--bad' : ''}`),
            el('div.insight__text', {}, emphasise(note.text)),
          )),
      );
    }
    
    /**
     * Render `**bold**` spans without touching innerHTML — the emphasis markers
     * come from coach.js, but the numbers inside them are user data, so they go
     * through text nodes like everything else.
     */
    function emphasise(text) {
      return text.split(/(\*\*[^*]+\*\*)/g).filter(Boolean).map((part) =>
        part.startsWith('**') && part.endsWith('**')
          ? el('b', {}, part.slice(2, -2))
          : part);
    }
    return { render };
  })();

  /* ============================================================
     js/screens/log.js
     ============================================================ */
  const screenLog = (() => {
    /**
     * log.js — the screen the app exists for.
     *
     * Design rule for this screen: nothing competes with the food grid. The
     * running total sits above it as a thin summary bar, meal templates get one
     * row of chips, and everything else is below the fold. One tap on a tile
     * logs one serving and the totals move immediately.
     */


    /** Day keys are the storage index, so only an exact YYYY-MM-DD is accepted. */
    const DAY_KEY = /^\d{4}-\d{2}-\d{2}$/;

    function render(params = {}) {
      // Defaults to today, but History can deep-link here to fix up a past day.
      //
      // The date comes from the URL, so it is validated before being used as a
      // storage key. A hand-typed `#/log?date=2026-9-5` would otherwise create
      // `days['2026-9-5']`, accept a full day of food, and then have the whole
      // day silently discarded by storage.normalise() on the next launch.
      const requestedKey = params.date || '';
      const requestedDate = DAY_KEY.test(requestedKey) ? fromKey(requestedKey) : null;
      const key = requestedDate && dayKey(requestedDate) === requestedKey && requestedKey <= dayKey()
        ? requestedKey
        : dayKey();
      const totals = nutrition.totalsFor(key);
      const goals = store.goals();
      const entries = store.day(key).entries;
      const dateInput = el('input.input', {
        id: 'log-date',
        type: 'date',
        value: key,
        max: dayKey(),
        onchange: () => {
          const selected = dateInput.value;
          const parsed = DAY_KEY.test(selected) ? fromKey(selected) : null;
          if (!parsed || dayKey(parsed) !== selected || selected > dayKey()) {
            dateInput.value = key;
            toast('Choose today or an earlier date');
            return;
          }
          go('log', { date: selected });
        },
      });

      return el('div', {},
        el('header.screen-head', {},
          el('div', {},
            el('div.cap', {}, friendlyDate(key)),
            el('h1.screen-title', {}, 'Log food'),
            el('div.field.log-date-field', {},
              el('label.field__label', { for: 'log-date' }, 'Date'),
              dateInput,
            ),
          ),
          entries.length
            ? el('button.btn.btn--sm', { type: 'button', onclick: () => openSaveTemplate(key) }, 'Save as meal')
            : null,
        ),

        runningTotal(totals, goals),
        templateChips(key),

        el('div.log-section-label', {}, 'Tap to add one serving'),
        foodGrid(key),

        entries.length ? loggedList(key, entries) : null,
        quickActions(key, entries.length),
      );
    }

    /* --------------------------------------------------------- running total -- */

    function runningTotal(totals, goals) {
      return el('div.log-total', { 'aria-live': 'polite' },
        el('span.log-total__kcal', {}, int(totals.calories)),
        el('span.cap', {}, `/ ${int(goals.calories)} kcal`),
        el('span.log-total__macros', {},
          `P ${grams(totals.protein)} · C ${grams(totals.carbs)} · F ${grams(totals.fat)}`),
      );
    }

    /* -------------------------------------------------------------- templates -- */

    function templateChips(key) {
      const templates = store.templates();
      if (!templates.length) return null;

      return el('div', {},
        el('div.log-section-label', {}, 'Meals'),
        el('div.chip-row', {},
          templates.map((tpl) =>
            el('button.chip', {
              type: 'button',
              onclick: () => {
                tapFeedback();
                const before = snapshot(key);
                const count = store.addTemplate(tpl.id, key);
                toast(`${tpl.name} added · ${count} items`, { onUndo: () => restore(key, before) });
              },
            }, `${tpl.emoji || '🍽️'}  ${tpl.name}`)),
        ),
      );
    }

    /* ------------------------------------------------------------- food grid -- */

    function foodGrid(key) {
      const pinned = store.foods().filter((f) => f.pinned !== false);
      const counts = new Map(store.day(key).entries.map((e) => [e.foodId, e.qty]));

      if (!pinned.length) {
        return el('div.card', {},
          el('div.empty', {},
            el('strong', {}, 'No foods pinned'),
            'Pin foods in Settings to put them on this grid.'));
      }

      return el('div.food-grid', {},
        pinned.map((food) => {
          const qty = counts.get(food.id) || 0;
          return el('button.food-btn', {
            type: 'button',
            'aria-label': `Add one ${food.name}, ${Math.round(food.calories)} calories`,
            onclick: () => {
              tapFeedback();
              const before = snapshot(key);
              store.addServing(food.id, 1, key);
              toast(`${food.emoji} ${food.name} added`, { onUndo: () => restore(key, before) });
            },
          },
            el('span.food-btn__emoji', {}, food.emoji),
            el('span.food-btn__name', {}, food.name),
            el('span.food-btn__macro', {},
              `${Math.round(food.calories)} kcal · ${grams(food.protein)}g P`),
            qty > 0 ? el('span.food-btn__count.num', {}, formatQty(qty)) : null,
          );
        }),
      );
    }

    /* ----------------------------------------------------------- logged list -- */

    function loggedList(key, entries) {
      return el('div', {},
        el('div.log-section-label', {}, `Logged ${friendlyDate(key).toLowerCase()}`),
        el('section.card.card--flush', {},
          entries.map((entry) => {
            const food = store.foodById(entry.foodId);
            const macros = nutrition.entryTotals(entry);

            return el('div.entry-row', {},
              el('span.entry-row__emoji', {}, food?.emoji ?? '❓'),
              el('div.grow', {},
                el('div.entry-row__name', {}, food?.name ?? 'Deleted food'),
                el('div.entry-row__macro', {},
                  `${int(macros.calories)} kcal · P ${grams(macros.protein)} · C ${grams(macros.carbs)} · F ${grams(macros.fat)}`),
              ),
              stepper(entry, key),
            );
          }),
        ),
      );
    }

    /** −/+ around a live quantity. Dropping to zero removes the row. */
    function stepper(entry, key) {
      return el('div.stepper', {},
        el('button.stepper__btn', {
          type: 'button',
          'aria-label': 'Remove one serving',
          onclick: () => { tapFeedback(); store.setEntryQty(entry.id, entry.qty - 1, key); },
        }, '−'),
        el('span.stepper__value', { 'aria-live': 'polite' }, formatQty(entry.qty)),
        el('button.stepper__btn', {
          type: 'button',
          'aria-label': 'Add one serving',
          onclick: () => { tapFeedback(); store.setEntryQty(entry.id, entry.qty + 1, key); },
        }, '+'),
      );
    }

    /* --------------------------------------------------------- quick actions -- */

    function quickActions(key, hasEntries) {
      const yesterday = addDays(key, -1);
      const canCopy = store.day(yesterday).entries.length > 0;

      return el('div.stack', { style: { gap: 'var(--s-2)', marginTop: 'var(--s-6)' } },
        canCopy && el('button.btn.btn--block', {
          type: 'button',
          onclick: () => {
            const before = snapshot(key);
            const n = store.copyDay(yesterday, key);
            toast(`Copied ${n} items from yesterday`, { onUndo: () => restore(key, before) });
          },
        }, 'Copy yesterday\'s food'),

        hasEntries && el('button.btn.btn--block.btn--danger', {
          type: 'button',
          onclick: () => {
            const before = snapshot(key);
            store.clearDay(key);
            toast('Day cleared', { onUndo: () => restore(key, before) });
          },
        }, 'Clear this day'),
      );
    }

    /* ------------------------------------------------------- save as template -- */

    function openSaveTemplate(key) {
      const nameInput = el('input.input', { type: 'text', placeholder: 'e.g. Weekday breakfast', maxlength: '40' });
      const emojiInput = el('input.input', { type: 'text', value: '🍽️', maxlength: '4', style: { textAlign: 'center' } });

      const save = () => {
        const name = nameInput.value.trim();
        if (!name) { nameInput.focus(); return; }
        const ok = store.templateFromDay(name, emojiInput.value.trim() || '🍽️', key);
        closeSheet();
        toast(ok ? `Saved "${name}"` : 'Nothing logged to save');
      };

      sheet({
        title: 'Save as a meal',
        body: el('div', {},
          el('p.cap', { style: { marginBottom: 'var(--s-4)' } },
            `Everything logged ${friendlyDate(key).toLowerCase()} becomes a one-tap meal.`),
          el('div.row', { style: { alignItems: 'flex-end', gap: 'var(--s-3)' } },
            el('div.field', { style: { width: '64px', marginBottom: 0 } },
              el('label.field__label', {}, 'Icon'), emojiInput),
            el('div.field.grow', { style: { marginBottom: 0 } },
              el('label.field__label', {}, 'Name'), nameInput),
          ),
          sheetActions('Save meal', save),
        ),
      });
    }

    /* ----------------------------------------------------------------- undo --- */

    /**
     * Undo works by snapshotting the day's entries before a bulk action and
     * restoring them wholesale. Cheaper and more reliable than an inverse
     * operation per action, and a day's entries are a dozen small objects.
     */
    function snapshot(key) {
      return structuredClone(store.day(key).entries);
    }

    function restore(key, entries) {
      store.clearDay(key);
      for (const e of entries) store.addServing(e.foodId, e.qty, key);
    }

    /** Show "3" not "3.0", but keep "1.5" for half servings. */
    function formatQty(qty) {
      return Number.isInteger(qty) ? String(qty) : String(Math.round(qty * 10) / 10);
    }
    return { render };
  })();

  /* ============================================================
     js/screens/history.js
     ============================================================ */
  const screenHistory = (() => {
    /**
     * history.js — past days, newest first.
     *
     * Each row carries the numbers and a four-bar glyph showing how close the
     * day came to each goal, so the list scans vertically without reading any
     * figures. Tapping a row expands what was eaten; tapping Edit deep-links
     * into the Log screen for that date.

    /** Which row is expanded. Module-level so it survives a state re-render. */
    let expandedKey = null;

    function render() {
      const keys = store.loggedDayKeys();

      return el('div', {},
        el('header.screen-head', {},
          el('div', {},
            el('div.cap', {}, keys.length ? `${keys.length} days recorded` : 'Nothing yet'),

    function openFoodExport() {

      const loggedDates = store.loggedDayKeys()
        .filter((key) => store.day(key).entries.length > 0 && key <= today)

        selectedDateInput(loggedDates.at(-1) || today));
      const startInput = el('input.input', {
