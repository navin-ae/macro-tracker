        id: 'food-export-status',
        role: 'status',
        'aria-live': 'polite',
        style: { minHeight: '1.4em', marginTop: 'var(--s-3)' },
      });
      const datesPanel = el('div', {},
        dateList,
        el('button.btn', {
          type: 'button',
          style: { width: '100%', marginTop: 'var(--s-2)' },
          onclick: () => dateList.append(selectedDateInput(today)),
        }, 'Add another date'),
      );
      const rangePanel = el('div', { class: 'hidden' },
        el('div.field', {},
          el('label.field__label', { for: 'food-export-start' }, 'From date'),
          startInput,
        ),
        el('div.field', {},
          el('label.field__label', { for: 'food-export-end' }, 'Through date'),
          endInput,
        ),
      );

      const datesMode = el('button.segmented__opt', {
        type: 'button',
        'aria-pressed': 'true',
        style: { minHeight: '44px' },
        onclick: () => setMode('dates'),
      }, 'Specific dates');
      const rangeMode = el('button.segmented__opt', {
        type: 'button',
        'aria-pressed': 'false',
        style: { minHeight: '44px' },
        onclick: () => setMode('range'),
      }, 'Date range');

      function setMode(mode) {
        selectedMode = mode;
        datesPanel.classList.toggle('hidden', mode !== 'dates');
        rangePanel.classList.toggle('hidden', mode !== 'range');
        datesMode.setAttribute('aria-pressed', String(mode === 'dates'));
        rangeMode.setAttribute('aria-pressed', String(mode === 'range'));
        status.textContent = '';
        status.setAttribute('role', 'status');
      }

      const exportRange = async () => {
        if (exporting) return;
        const validDate = (key) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) return false;
          return dayKey(fromKey(key)) === key && key <= today;
        };
        let selectedDates;
        let filenameDates;
        if (selectedMode === 'dates') {
          selectedDates = [...dateList.querySelectorAll('input[type="date"]')].map((input) => input.value);
          if (!selectedDates.length || selectedDates.some((key) => !validDate(key))) {
            status.setAttribute('role', 'alert');
            status.textContent = 'Choose valid dates up to today.';
            return;
          }
          if (new Set(selectedDates).size !== selectedDates.length) {
            status.setAttribute('role', 'alert');
            status.textContent = 'Each date can only be selected once.';
            return;
          }
          selectedDates.sort();
          filenameDates = selectedDates.length === 1
            ? selectedDates[0]
            : 'selected-dates';
        } else {
          const start = startInput.value;
          const end = endInput.value;
          if (!validDate(start) || !validDate(end)) {
            status.setAttribute('role', 'alert');
            status.textContent = 'Choose valid dates up to today.';
            return;
          }
          if (start > end) {
            status.setAttribute('role', 'alert');
            status.textContent = 'The start date must be on or before the end date.';
            return;
          }
          selectedDates = store.loggedDayKeys().filter((key) => key >= start && key <= end);
          filenameDates = `${start}-to-${end}`;
        }

        const rows = selectedDates
          .sort()
          .flatMap((key) => store.day(key).entries.map((entry) => {
            const food = store.foodById(entry.foodId);
            const macros = nutrition.entryTotals(entry);
            return [key, food?.name ?? 'Deleted food', food?.serving ?? '', formatQty(entry.qty),
              macros.calories, macros.protein, macros.carbs, macros.fat];
          }));

        if (!rows.length) {
          status.textContent = 'No food entries were found in that date range.';
          return;
        }

        const csvCell = (value) => {
          let text = String(value ?? '');
          if (/^[=+@\-\t\r]/.test(text)) text = `'${text}`;
          return `"${text.replaceAll('"', '""')}"`;
        };
        const csv = [
          ['Date', 'Food', 'Serving', 'Quantity', 'Calories (kcal)', 'Protein (g)', 'Carbs (g)', 'Fat (g)'],
          ...rows,
        ].map((row) => row.map(csvCell).join(',')).join('\r\n');
        const name = `macrotrack-foods-${filenameDates}.csv`;
        const blob = new Blob(['\uFEFF', csv], { type: 'text/csv;charset=utf-8' });
        exporting = true;

        try {
          const file = new File([blob], name, { type: 'text/csv' });
          if (navigator.canShare?.({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Food log export' });
            closeSheet();
            toast(`Exported ${rows.length} food ${rows.length === 1 ? 'entry' : 'entries'}`);
            return;
          }
        } catch (err) {
          if (err?.name === 'AbortError') {
            exporting = false;
            status.textContent = 'Export cancelled.';
            return;
          }
          console.error('[history] CSV share failed', err);
        }

        try {
          const url = URL.createObjectURL(blob);
          const link = el('a', { href: url, download: name, style: { display: 'none' } });
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10_000);
          closeSheet();
          toast(`Exported ${rows.length} food ${rows.length === 1 ? 'entry' : 'entries'}`);
        } catch (err) {
          console.error('[history] CSV export failed', err);
          exporting = false;
          status.setAttribute('role', 'alert');
          status.textContent = 'Could not export this food range. Try again.';
        }
      };

      sheet({
        title: 'Export foods',
        body: el('div', {},
          el('p.cap', { style: { marginBottom: 'var(--s-4)' } },
            'Export one row per food entry, including serving quantity and macros.'),
          el('div.segmented', { role: 'group', 'aria-label': 'Date selection mode', style: { marginBottom: 'var(--s-4)' } },
            datesMode,
            rangeMode,
          ),
          datesPanel,
          rangePanel,
          status,
          sheetActions('Export CSV', exportRange),
        ),
      });
    }

    /* ------------------------------------------------------------ week card --- */

    function weekSummary() {
      const week = lastNDays(7);
      const logged = week.filter((k) => store.day(k).entries.length > 0);
      if (!logged.length) return null;

      const goals = store.goals();
      const avg = (macro) => nutrition.averageMacro(week, macro);

      const stat = (label, value, unit, color) =>
        el('div', {},
          el('div.micro', {}, label),
          el('div', { style: { fontSize: 'var(--t-h1)', fontWeight: '650', letterSpacing: '-0.02em', color },
                      class: 'num' },
            `${value}${unit}`),
        );

      return el('section.card', {},
        el('div.card-head', {},
          el('h2.card-title', {}, 'Last 7 days'),
          el('span.cap', {}, `${logged.length} logged`),
        ),
        el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 'var(--s-3)' } },
          stat('Cal / day', int(avg('calories')), '', 'var(--c-calories)'),
          stat('Protein', grams(avg('protein')), 'g', 'var(--c-protein)'),
          stat('Carbs', grams(avg('carbs')), 'g', 'var(--c-carbs)'),
          stat('Fat', grams(avg('fat')), 'g', 'var(--c-fat)'),
        ),
        el('div.cap', { style: { marginTop: 'var(--s-4)' } },
          `Protein goal met on ${nutrition.daysHittingGoal(week, 'protein')} of ${logged.length} logged days · target ${goals.protein} g`),
      );
    }

    /* -------------------------------------------------------------- day row --- */

    function dayRow(key) {
      const totals = nutrition.totalsFor(key);
      const goals = store.goals();
      const day = store.day(key);
      const expanded = expandedKey === key;

      const row = el('button.history-day', {
        type: 'button',
        'aria-expanded': String(expanded),
        onclick: () => {
          expandedKey = expanded ? null : key;
          // Re-render through the router so the screen rebuilds from state and
          // keeps its scroll position (the route itself hasn't changed).
          rerender();
        },
      },
        el('div.history-day__date', {},
          el('div.history-day__dow', {}, key === dayKey() ? 'Today' : shortDow(key)),
          el('div.history-day__dom', {}, dayOfMonth(key)),
        ),
        dayBars(totals, goals),
        el('div.grow', {},
          el('div.history-day__kcal', {}, `${int(totals.calories)} kcal`),
          el('div.history-day__macros', {},
            `P ${grams(totals.protein)} · C ${grams(totals.carbs)} · F ${grams(totals.fat)}`),
        ),
        el('div.stack', { style: { alignItems: 'flex-end' } },
          day.weight ? el('div.micro', {}, `${kg(day.weight)} ${store.settings().weightUnit}`) : null,
          typeof day.steps === 'number' ? el('div.micro', {}, `${int(day.steps)} steps`) : null,
        ),
      );

      if (!expanded) return row;

      return el('div', {}, row, dayDetail(key, day));
    }

    function dayDetail(key, day) {
      return el('div.history-detail', {},
        el('div.micro', { style: { marginBottom: 'var(--s-2)' } }, shortDate(key)),

        day.entries.length
          ? day.entries.map((entry) => {
              const food = store.foodById(entry.foodId);
              const macros = nutrition.entryTotals(entry);
              return el('div.history-detail__item', {},
                el('span', {}, `${food?.emoji ?? '❓'} ${formatQty(entry.qty)} × ${food?.name ?? 'Deleted food'}`),
                el('span.num', {}, `${int(macros.calories)} kcal`),
              );
            })
          : el('div.cap', {}, 'No food logged this day.'),

        el('button.btn.btn--quiet', {
          type: 'button',
          style: { marginTop: 'var(--s-3)', paddingLeft: 0, minHeight: '48px' },
          onclick: (e) => { e.stopPropagation(); go('log', { date: key }); },
        }, `Log foods for ${friendlyDate(key).toLowerCase()} →`),
      );
    }

    const formatQty = (qty) => (Number.isInteger(qty) ? String(qty) : String(Math.round(qty * 10) / 10));
    return { render };
  })();

  /* ============================================================
     js/screens/weight.js
     ============================================================ */
  const screenWeight = (() => {
    /**
     * weight.js — weigh-in entry and the trend chart.
     *
     * The number that matters here is the trend, not today's reading, so the
     * chart plots the smoothed line and draws the raw weigh-ins as dots on top.
     * The deltas compare three-day averages at each end of the window for the
     * same reason — see domain/weight.js.
     */


    /** Chart window in days. Module-level so it survives re-renders. */
    let rangeDays = 90;

    const RANGES = [
      { days: 30, label: '1M' },
      { days: 90, label: '3M' },
      { days: 365, label: '1Y' },
      { days: 36500, label: 'All' },
    ];

    function render() {
      const today = dayKey();
      const unit = store.settings().weightUnit;
      const latest = weight.latest();
      const todayWeight = store.day(today).weight;

      return el('div', {},
        el('header.screen-head', {},
          el('div', {},
            el('div.cap', {}, latest ? `Last weigh-in ${friendlyDate(latest.key).toLowerCase()}` : 'No weigh-ins yet'),
            el('h1.screen-title', {}, 'Weight'),
          ),
        ),

        entryCard(today, todayWeight, unit),
        trendCard(today, unit),
      );
    }

    /* --------------------------------------------------------- entry + stats -- */

    function entryCard(today, todayWeight, unit) {
      const latest = weight.latest();
      const weekly = weight.weeklyChange(today);
      const monthly = weight.monthlyChange(today);

      const input = el('input.input', {
        type: 'number',
        inputmode: 'decimal',
        step: '0.1',
        min: '20',
        max: '400',
        placeholder: latest ? kg(latest.value) : '72.5',
        value: todayWeight ?? '',
        'aria-label': `Weight today in ${unit}`,
      });

      const save = () => {
        const raw = input.value.trim();
        if (raw === '') {
          store.setWeight(null, today);
          toast('Today\'s weight cleared');
          return;
        }
        const value = Number(raw);
        if (!Number.isFinite(value) || value < 20 || value > 400) {
          toast(`Enter a weight between 20 and 400 ${unit}`);
          input.focus();
          return;
        }
        store.setWeight(Math.round(value * 10) / 10, today);
        tapFeedback();
        toast(`Weight saved · ${kg(value)} ${unit}`);
        input.blur();
      };

      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });

      return el('section.card', {},
        el('div.weight-hero', {},
          el('span.display', {}, latest ? kg(latest.value) : '—'),
          el('span.weight-hero__unit', {}, unit),
        ),

        el('div.row', { style: { gap: 'var(--s-3)' } },
          el('div.grow', {}, input),
          el('button.btn.btn--primary', { type: 'button', onclick: save }, 'Save'),
        ),
        el('div.cap', { style: { marginTop: 'var(--s-2)' } },
          todayWeight ? `Recorded for ${friendlyDate(today).toLowerCase()}` : 'Weigh in at the same time each day for a cleaner trend.'),

        el('div.delta-grid', {},
          deltaTile('This week', weekly, unit),
          deltaTile('This month', monthly, unit),
        ),
      );
    }

    /**
     * A delta tile. `null` means not enough readings to compare — showing
     * "0.0 kg" in that case would claim a stable weight we haven't measured.
     */
    function deltaTile(label, value, unit) {
      const tone = value === null || value === 0 ? '' : value < 0 ? '.delta__value--down' : '.delta__value--up';
      return el('div.delta', {},
        el('div.delta__label', {}, label),
        el(`div.delta__value${tone}`, {},
          value === null ? '—' : `${signed(value)} ${unit}`),
        value === null ? el('div.micro', {}, 'needs two weigh-ins') : null,
      );
    }

    /* ----------------------------------------------------------------- chart -- */

    function trendCard(today, unit) {
      const points = weight.seriesWithin(rangeDays, today);
      const trend = weight.trendLine(points);

      return el('section.card', {},
        el('div.card-head', {},
          el('div', {},
            el('h2.card-title', {}, 'Trend'),
            el('span.cap', {}, 'line is the smoothed trend · dots are weigh-ins'),
          ),
        ),

        el('div.segmented', { style: { marginBottom: 'var(--s-4)' }, role: 'group', 'aria-label': 'Chart range' },
          RANGES.map((r) =>
            el('button.segmented__opt', {
              type: 'button',
              'aria-pressed': String(rangeDays === r.days),
              onclick: () => { rangeDays = r.days; rerender(); },
            }, r.label)),
        ),

        weightChart(points, trend, { unit }),

        points.length >= 2 ? rangeFooter(points, unit) : null,
      );
    }

    function rangeFooter(points, unit) {
      const values = points.map((p) => p.value);
      const lo = Math.min(...values);
      const hi = Math.max(...values);
      const change = points[points.length - 1].value - points[0].value;

      return el('div.row-between', { style: { marginTop: 'var(--s-4)' } },
        el('span.cap', {}, `${points.length} weigh-ins`),
        el('span.cap.num', {}, `low ${kg(lo)} · high ${kg(hi)} · net ${signed(change)} ${unit}`),
      );
    }
    return { render };
  })();

  /* ============================================================
     js/screens/settings.js
     ============================================================ */
  const screenSettings = (() => {
    /**
     * settings.js — goals, the food database, meals, appearance, and backup.
     *
     * Grouped as iOS inset lists. Goals come first because they're what a new
     * user changes on day one; destructive actions sit last, behind a
     * confirmation.
     */
    
    
    function render() {
      return el('div', {},
        el('header.screen-head', {},
          el('h1.screen-title', {}, 'Settings'),
        ),
    
        goalsCard(),
        foodsCard(),
        mealsCard(),
        appearanceCard(),
        stepsCard(),
        dataCard(),
    
        el('div', { style: { textAlign: 'center', marginTop: 'var(--s-6)' } },
          el('p.micro', {}, 'MacroTrack · Designed by Navin'),
          el('p.micro', { style: { marginTop: '2px' } }, 'Your data stays on this device'),
        ),
      );
    }
    
    /* ----------------------------------------------------------------- goals -- */
    
    function goalsCard() {
      const goals = store.goals();
    
      const goalRow = (macro, label, unit) => {
        const input = el('input.input', {
          type: 'number', inputmode: 'numeric', min: '0', step: macro === 'steps' ? '500' : '5',
          value: goals[macro],
          'aria-label': `${label} goal`,
          style: { width: '96px', textAlign: 'right', background: 'var(--card-2)' },
          onchange: (e) => {
            store.setGoal(macro, e.target.value);
            toast(`${label} goal set to ${int(e.target.value)} ${unit}`);
          },
        });
    
        return el('div.list-row', {},
          macro !== 'steps'
            ? el('span', { style: {
                width: '10px', height: '10px', borderRadius: '50%', flex: 'none',
                background: MACRO_META[macro].color } })
            : el('span', { style: { width: '10px', flex: 'none' } }),
          el('span.grow', {}, label),
          input,
          el('span.cap', { style: { width: '32px' } }, unit),
        );
      };
    
      return el('div', {},
        el('div.settings-group-label', {}, 'DAILY GOALS'),
        el('section.card.card--flush', {},
          goalRow('calories', 'Calories', 'kcal'),
          goalRow('protein', 'Protein', 'g'),
          goalRow('carbs', 'Carbs', 'g'),
          goalRow('fat', 'Fat', 'g'),
          goalRow('steps', 'Steps', ''),
        ),
        el('p.cap', { style: { margin: 'var(--s-2) var(--s-5)' } }, energyHint()),
      );
    }
    
    /**
     * Reconstructs calories from the macro goals and flags a mismatch. A user
     * who sets 150 P / 200 C / 70 F and leaves calories at 2200 has goals that
     * can't all be met at once; better to say so than let the rings disagree.
     */
    function energyHint() {
      const g = store.goals();
      const fromMacros = g.protein * 4 + g.carbs * 4 + g.fat * 9;
      const diff = fromMacros - g.calories;
      if (Math.abs(diff) <= 60) return `Your macro goals add up to ${int(fromMacros)} kcal — consistent with your calorie goal.`;
      return diff > 0
        ? `Your macro goals add up to ${int(fromMacros)} kcal, ${int(diff)} above your calorie goal. Hitting all four at once isn't possible.`
        : `Your macro goals add up to ${int(fromMacros)} kcal, ${int(-diff)} below your calorie goal. You'd hit the macros with calories to spare.`;
    }
    
    /* ----------------------------------------------------------------- foods -- */
    
    function foodsCard() {
      const foods = store.foods();
    
      return el('div', {},
        el('div.settings-group-label', {}, `FOODS · ${foods.length}`),
        el('section.card.card--flush', {},
          foods.map((food) =>
            el('button.food-edit-row', {
              type: 'button',
              onclick: () => openFoodEditor(food.id),
            },
              el('span', { style: { fontSize: '20px' } }, food.emoji),
              el('div.grow', {},
                el('div', { style: { fontWeight: '550' } }, food.name),
                el('div.food-edit-row__macros', {},
                  `${food.serving} · ${int(food.calories)} kcal · P ${grams(food.protein)} · C ${grams(food.carbs)} · F ${grams(food.fat)}`),
              ),
              food.estimated ? el('span.badge-est', {}, 'EST') : null,
              food.pinned === false ? el('span.badge-est', {}, 'HIDDEN') : null,
              el('span.list-row__chevron', {}, icon('chevron')),
            )),
    
          el('button.list-row.list-row--tap', {
            type: 'button',
            onclick: () => openFoodEditor(null),
            style: { color: 'var(--accent)', fontWeight: '600' },
          }, el('span', {}, '+ Add a food')),
        ),
        el('p.cap', { style: { margin: 'var(--s-2) var(--s-5)' } },
          'EST marks a value seeded from standard composition tables. Saving your own numbers clears the badge.'),
      );
    }
    
    /**
     * Create or edit a food. One sheet for both — the only difference is whether
     * a Delete action appears.
     */
    function openFoodEditor(foodId) {
      const existing = foodId ? store.foodById(foodId) : null;
      const f = existing || { emoji: '🍽️', name: '', serving: '1 serving', calories: 0, protein: 0, carbs: 0, fat: 0, pinned: true };
    
      const emoji = el('input.input', { type: 'text', value: f.emoji, maxlength: '4', style: { textAlign: 'center' } });
      const name = el('input.input', { type: 'text', value: f.name, placeholder: 'Food name', maxlength: '40' });
      const serving = el('input.input', { type: 'text', value: f.serving, placeholder: 'e.g. 1 large (50 g)', maxlength: '30' });
    
      const macroField = (key, label) => {
        const input = el('input.input', {
          type: 'number', inputmode: 'decimal', min: '0', step: '0.1',
          value: f[key], 'aria-label': label,
          style: { textAlign: 'center', padding: '12px 4px' },
        });
        return { input, node: el('div.field', { style: { marginBottom: 0 } },
          el('label.field__label', { style: { textAlign: 'center' } }, label), input) };
      };
    
      const cal = macroField('calories', 'kcal');
      const pro = macroField('protein', 'P (g)');
      const carb = macroField('carbs', 'C (g)');
      const fat = macroField('fat', 'F (g)');
    
      const pinned = el('button.toggle', {
        type: 'button',
        'aria-pressed': String(f.pinned !== false),
        'aria-label': 'Show on the Log screen grid',
        onclick: (e) => {
          const next = e.currentTarget.getAttribute('aria-pressed') !== 'true';
          e.currentTarget.setAttribute('aria-pressed', String(next));
        },
      });
    
      // Live check that the macros reconstruct the stated calories. Not enforced —
      // packaging rounds too — but a 200 kcal gap usually means a typo.
      const reconcile = el('p.cap', { style: { marginTop: 'var(--s-2)' } });
      const updateReconcile = () => {
        const kcal = Number(cal.input.value) || 0;
        const fromMacros = (Number(pro.input.value) || 0) * 4 + (Number(carb.input.value) || 0) * 4 + (Number(fat.input.value) || 0) * 9;
        const diff = Math.round(fromMacros - kcal);
        reconcile.textContent = Math.abs(diff) <= 20
          ? `Macros work out to ${int(fromMacros)} kcal — that checks out.`
          : `Macros work out to ${int(fromMacros)} kcal, ${int(Math.abs(diff))} ${diff > 0 ? 'above' : 'below'} the calories you entered.`;
        reconcile.style.color = Math.abs(diff) <= 20 ? 'var(--ink-2)' : 'var(--warn)';
      };
      for (const field of [cal, pro, carb, fat]) field.input.addEventListener('input', updateReconcile);
      updateReconcile();
    
      const save = () => {
        const trimmed = name.value.trim();
        if (!trimmed) { name.focus(); toast('Give the food a name'); return; }
    
        const patch = {
          emoji: emoji.value.trim() || '🍽️',
          name: trimmed,
          serving: serving.value.trim() || '1 serving',
          calories: Number(cal.input.value) || 0,
          protein: Number(pro.input.value) || 0,
          carbs: Number(carb.input.value) || 0,
          fat: Number(fat.input.value) || 0,
          pinned: pinned.getAttribute('aria-pressed') === 'true',
        };
    
        if (existing) store.updateFood(existing.id, patch);
        else store.addFood(patch);
    
        closeSheet();
        toast(existing ? `${trimmed} updated` : `${trimmed} added`);
      };
    
      sheet({
        title: existing ? 'Edit food' : 'Add a food',
        body: el('div', {},
          el('div.row', { style: { alignItems: 'flex-end', gap: 'var(--s-3)' } },
            el('div.field', { style: { width: '64px', marginBottom: 0 } },
              el('label.field__label', {}, 'Icon'), emoji),
            el('div.field.grow', { style: { marginBottom: 0 } },
              el('label.field__label', {}, 'Name'), name),
          ),
    
          el('div.field', { style: { marginTop: 'var(--s-4)' } },
            el('label.field__label', {}, 'One serving is'), serving),
    
          el('div.field__label', { style: { marginBottom: 'var(--s-2)' } }, 'Per serving'),
          el('div.field-grid', {}, cal.node, pro.node, carb.node, fat.node),
          reconcile,
    
          el('div.list-row', { style: { paddingInline: 0, marginTop: 'var(--s-3)' } },
            el('div.grow', {},
              el('div', {}, 'Show on the Log grid'),
              el('div.cap', {}, 'Off keeps it in the database but off the one-tap screen')),
            pinned),
    
          sheetActions(existing ? 'Save changes' : 'Add food', save),
    
          existing && !isSeed(existing.id) ? el('button.btn.btn--block.btn--danger', {
            type: 'button',
            style: { marginTop: 'var(--s-2)' },
            onclick: () => {
              store.removeFood(existing.id);
              closeSheet();
              toast(`${existing.name} deleted`);
            },
          }, 'Delete food') : null,
        ),
      });
    }
    
    /** Seed foods can be hidden but not deleted, so the defaults can't be lost. */
    const SEED_IDS = new Set(['milk', 'curd', 'egg', 'chapati', 'dosa', 'ragi-dosa',
      'chicken', 'paneer', 'coffee', 'ragi-laddu', 'whey', 'fruit']);
    const isSeed = (id) => SEED_IDS.has(id);
    
    /* ----------------------------------------------------------------- meals -- */
    
    function mealsCard() {
      const templates = store.templates();
    
      return el('div', {},
        el('div.settings-group-label', {}, 'MEALS'),
        el('section.card.card--flush', {},
          templates.length
            ? templates.map((tpl) =>
                el('button.food-edit-row', {
                  type: 'button',
                  onclick: () => openMealEditor(tpl.id),
                },
                  el('span', { style: { fontSize: '20px' } }, tpl.emoji || '🍽️'),
                  el('div.grow', {},
                    el('div', { style: { fontWeight: '550' } }, tpl.name),
                    el('div.food-edit-row__macros', {},
                      `${int(mealTotals(tpl.items).calories)} kcal · ${describeTemplate(tpl)}`),
                  ),
                  el('span.list-row__chevron', {}, icon('chevron')),
                ))
            : el('div.empty', {},
                el('strong', {}, 'No meals yet'),
                'Add one below, or log a day\'s food and tap "Save as meal" on the Log screen.'),
    
          el('button.list-row.list-row--tap', {
            type: 'button',
            onclick: () => openMealEditor(null),
            style: { color: 'var(--accent)', fontWeight: '600' },
          }, el('span', {}, '+ Add a meal')),
        ),
        el('p.cap', { style: { margin: 'var(--s-2) var(--s-5)' } },
          'Tap a meal to change what\'s in it. The defaults are a starting point — nobody eats the same breakfast.'),
      );
    }
    
    function describeTemplate(tpl) {
      return tpl.items
        .map((item) => {
          const food = store.foodById(item.foodId);
          return food ? `${item.qty} × ${food.name}` : null;
        })
        .filter(Boolean)
        .join(' · ') || 'Every food in this meal has been deleted';
    }
    
    /** Macros for a list of {foodId, qty}. Deleted foods contribute nothing. */
    function mealTotals(items) {
      return items.reduce((acc, item) => {
        const t = nutrition.entryTotals(item);
        for (const macro of ['calories', 'protein', 'carbs', 'fat']) acc[macro] += t[macro];
        return acc;
      }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
    }
    
    /**
     * Create or edit a meal.
     *
     * Edits go to a local draft and only reach the store on Save, so Cancel is a
     * real cancel and a half-built meal can never be logged. The food picker is
     * an inline chip row rather than a second sheet — sheets don't nest here, and
     * with a dozen foods a tap-to-add row is faster than a search field anyway.
     */
    function openMealEditor(templateId) {
      const existing = templateId ? store.templates().find((t) => t.id === templateId) : null;
    
      const draft = {
        id: existing?.id ?? null,
        name: existing?.name ?? '',
        emoji: existing?.emoji ?? '🍽️',
        items: (existing?.items ?? []).map((i) => ({ ...i })),
      };
    
      const emojiInput = el('input.input', {
        type: 'text', value: draft.emoji, maxlength: '4', style: { textAlign: 'center' },
        'aria-label': 'Meal icon',
      });
      const nameInput = el('input.input', {
        type: 'text', value: draft.name, placeholder: 'e.g. Weekday breakfast', maxlength: '40',
        'aria-label': 'Meal name',
      });
    
      const itemsBox = el('div');
      const totalLine = el('p.cap', { 'aria-live': 'polite' });
    
      // Only the item list redraws as you adjust quantities; the name field and
      // the picker keep their state (and the keyboard doesn't dismiss).
      const renderItems = () => {
        const totals = mealTotals(draft.items);
        totalLine.textContent = draft.items.length
          ? `${int(totals.calories)} kcal · P ${grams(totals.protein)} · C ${grams(totals.carbs)} · F ${grams(totals.fat)}`
          : 'Nothing in this meal yet — tap a food below to add it.';
    
        itemsBox.replaceChildren(...(draft.items.length
          ? draft.items.map((item, index) => {
              const food = store.foodById(item.foodId);
              return el('div.entry-row', { style: { paddingInline: '0' } },
                el('span.entry-row__emoji', {}, food?.emoji ?? '❓'),
                el('div.grow', {},
                  el('div.entry-row__name', {}, food?.name ?? 'Deleted food'),
                  el('div.entry-row__macro', {},
                    food ? `${int(food.calories * item.qty)} kcal` : 'no longer in your foods'),
                ),
                el('div.stepper', {},
                  el('button.stepper__btn', {
                    type: 'button',
                    'aria-label': `One less ${food?.name ?? 'item'}`,
                    onclick: () => {
                      item.qty -= 1;
                      if (item.qty <= 0) draft.items.splice(index, 1);
                      renderItems();
                    },
                  }, '−'),
                  el('span.stepper__value', {}, String(item.qty)),
                  el('button.stepper__btn', {
                    type: 'button',
                    'aria-label': `One more ${food?.name ?? 'item'}`,
                    onclick: () => { item.qty += 1; renderItems(); },
                  }, '+'),
                ),
              );
            })
          : []));
      };
      renderItems();
    
      const addFood = (foodId) => {
        const found = draft.items.find((i) => i.foodId === foodId);
        if (found) found.qty += 1;
        else draft.items.push({ foodId, qty: 1 });
        tapFeedback();
        renderItems();
      };
    
      const save = () => {
        const name = nameInput.value.trim();
        if (!name) { nameInput.focus(); toast('Give the meal a name'); return; }
        if (!draft.items.length) { toast('Add at least one food to the meal'); return; }
    
        store.saveTemplate({
          id: draft.id,
          name,
          emoji: emojiInput.value.trim() || '🍽️',
          items: draft.items,
        });
        closeSheet();
        toast(existing ? `${name} updated` : `${name} added`);
      };
    
      sheet({
        title: existing ? 'Edit meal' : 'New meal',
        body: el('div', {},
          el('div.row', { style: { alignItems: 'flex-end', gap: 'var(--s-3)' } },
            el('div.field', { style: { width: '64px', marginBottom: 0 } },
              el('label.field__label', {}, 'Icon'), emojiInput),
            el('div.field.grow', { style: { marginBottom: 0 } },
              el('label.field__label', {}, 'Name'), nameInput),
          ),
    
          el('div.field__label', { style: { margin: 'var(--s-5) 0 var(--s-2)' } }, 'In this meal'),
          itemsBox,
          totalLine,
    
          el('div.field__label', { style: { margin: 'var(--s-5) 0 var(--s-2)' } }, 'Tap to add'),
          el('div.chip-row', {},
            store.foods().map((food) =>
              el('button.chip', {
                type: 'button',
                'aria-label': `Add ${food.name} to this meal`,
                onclick: () => addFood(food.id),
              }, `${food.emoji} ${food.name}`))),
    
          sheetActions(existing ? 'Save meal' : 'Add meal', save),
    
          existing ? el('button.btn.btn--block.btn--danger', {
            type: 'button',
            style: { marginTop: 'var(--s-2)' },
            onclick: () => {
              store.removeTemplate(existing.id);
              closeSheet();
              toast(`${existing.name} removed`);
            },
          }, 'Delete meal') : null,
        ),
      });
    
      // A new meal needs a name before anything else; an existing one is usually
      // opened to change its contents, so don't pop the keyboard over the list.
      if (!existing) requestAnimationFrame(() => nameInput.focus());
    }
    
    /* ------------------------------------------------------------ appearance -- */
    
    function appearanceCard() {
      const current = store.settings().theme || 'system';
    
      return el('div', {},
        el('div.settings-group-label', {}, 'APPEARANCE'),
        el('section.card.card--flush', {},
          el('div.list-row', {},
            el('span.grow', {}, 'Theme'),
            el('div.segmented', { style: { width: '190px' }, role: 'group', 'aria-label': 'Theme' },
              ['system', 'light', 'dark'].map((choice) =>
                el('button.segmented__opt', {
                  type: 'button',
                  'aria-pressed': String(current === choice),
                  onclick: () => {
                    store.setSetting('theme', choice);
                    applyTheme();
                    rerender();
                  },
                }, choice[0].toUpperCase() + choice.slice(1)))),
          ),
        ),
      );
    }
    
    /* ----------------------------------------------------------------- steps -- */
    
    function stepsCard() {
      const current = store.settings().stepSource || 'manual';
    
      return el('div', {},
        el('div.settings-group-label', {}, 'STEPS'),
        el('section.card.card--flush', {},
          listProviders().map((provider) => {
            const available = provider.isAvailable();
            return el('button.list-row', {
              type: 'button',
              class: available ? 'list-row--tap' : '',
              disabled: !available,
              style: available ? {} : { opacity: '0.5' },
              onclick: () => {
                if (!available) return;
                tapFeedback();
                store.setSetting('stepSource', provider.id);
                rerender();
              },
            },
              el('div.grow', {},
                el('div', {}, provider.label),
                !available ? el('div.micro', {}, 'Needs the iOS companion app — not available in the browser') : null),
              current === provider.id && available
                ? el('span', { style: { color: 'var(--accent)', fontWeight: '700' } }, '✓')
                : null,
            );
          }),
        ),
      );
    }
    
    /* ------------------------------------------------------------------ data -- */
    
    function dataCard() {
      return el('div', {},
        el('div.settings-group-label', {}, 'DATA'),
        el('section.card.card--flush', {},
          el('button.list-row.list-row--tap', { type: 'button', onclick: exportBackup },
            el('span.grow', {}, 'Export a backup'),
            el('span.cap', {}, '.json'),
            el('span.list-row__chevron', {}, icon('chevron'))),
    
          el('button.list-row.list-row--tap', { type: 'button', onclick: importBackup },
            el('span.grow', {}, 'Restore from a backup'),
            el('span.list-row__chevron', {}, icon('chevron'))),
    
          el('button.list-row.list-row--tap', {
            type: 'button',
            style: { color: 'var(--bad)' },
            onclick: confirmReset,
          }, el('span.grow', {}, 'Erase all data')),
        ),
        el('p.cap', { style: { margin: 'var(--s-2) var(--s-5)' } },
          'Everything is stored on this device only. The export file is your only backup — clearing Safari\'s website data erases the app\'s history.'),
      );
    }
    
    /**
     * Save a backup file.
     *
     * This is the only copy of the user's history that can leave the device, so
     * it has to actually work rather than just appear to:
     *
     *   - The anchor is appended to the document before it is clicked. A
     *     synthetic click on a detached anchor is a no-op in Firefox.
     *   - The blob URL is revoked on a later tick. Revoking it in the same tick
     *     as the click can cancel the download while it is still in flight.
     *   - On iOS the `download` attribute is largely ignored — Safari opens the
     *     JSON in a tab instead of saving it — so the Web Share sheet is tried
     *     first, which lets the user file it in Files or iCloud Drive.
     *   - The toast only claims success once something actually happened.
     */
    async function exportBackup() {
      const name = `macrotrack-${new Date().toISOString().slice(0, 10)}.json`;
      const json = store.exportJSON();
      const blob = new Blob([json], { type: 'application/json' });
    
      // Preferred path on iOS: the system share sheet.
      try {
        const file = new File([blob], name, { type: 'application/json' });
        if (navigator.canShare?.({ files: [file] })) {
          await navigator.share({ files: [file], title: 'MacroTrack backup' });
          toast('Backup shared');
          return;
        }
      } catch (err) {
        // A user dismissing the share sheet lands here; that is not an error,
        // and it should not fall through to a second, surprise download.
        if (err?.name === 'AbortError') return;
      }
    
      try {
        const url = URL.createObjectURL(blob);
        const link = el('a', { href: url, download: name, style: { display: 'none' } });
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10_000);
        toast('Backup saved');
      } catch (err) {
        console.error('[settings] export failed', err);
        toast('Could not save the backup file');
      }
    }
    
    function importBackup() {
      const picker = el('input', { type: 'file', accept: 'application/json,.json' });
      picker.addEventListener('change', async () => {
        const file = picker.files?.[0];
        if (!file) return;
        try {
          store.importJSON(await file.text());
          applyTheme();
          rerender();
          toast('Backup restored');
        } catch (err) {
          toast(err.message || 'That file could not be read');
        }
      });
      picker.click();
    }
    
    function confirmReset() {
      sheet({
        title: 'Erase all data?',
        body: el('div', {},
          el('p.sub', {},
            'This deletes every logged day, weight and custom food on this device, and puts the default foods back. It cannot be undone.'),
          sheetActions('Erase everything', () => {
            store.resetAll();
            applyTheme();
            closeSheet();
            rerender();
            toast('All data erased');
          }, { destructive: true }),
        ),
      });
    }
    return { render };
  })();

  /* ============================================================
     boot (js/app.js)
     ============================================================ */
  applyTheme();
  watchSystemTheme();

  route('dashboard', screenDashboard);
  route('log', screenLog);
  route('history', screenHistory);
  route('weight', screenWeight);
  route('settings', screenSettings);

  buildNav();
  setOnChange(setActiveTab);

  // Any state change repaints the active screen.
  store.subscribe(renderRoute);

  startRouter();

  // Registered after first paint so it never delays the app opening. Only over
  // http(s) — opening the file directly still works, just without offline
  // caching (and a service worker cannot register from file:// anyway).
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('[app] service worker registration failed', err);
      });
    });
  }

  // An installed PWA can sit in the background for days. Re-render on return
  // so "Today" is actually today.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') renderRoute();
  });

})();
</script>
</body>
</html>
