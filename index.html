<style>
/* ============================================================================
   tokens.css — the entire design system in one place.
   Change a value here and it propagates everywhere. No other file defines
   a raw colour, radius, or font size.
   ========================================================================= */

:root {
  /* --- Macro identity colours -------------------------------------------
     These four are a *categorical* palette: each hue means one macro, and
     the mapping never changes. The set was validated for
       - OKLCH lightness band (light 0.43–0.77, dark 0.48–0.67)
       - chroma floor
       - colour-vision-deficiency separation (protan/deutan/tritan)
       - >= 3:1 contrast against BOTH the light and dark card surface
     so the same four values are safe in light and dark mode. Don't
     "brighten them for dark" — that breaks the validation.                */
  --c-calories: #C97C05;  /* marigold */
  --c-protein:  #00996F;  /* jade     */
  --c-carbs:    #3366DB;  /* cobalt   */
  --c-fat:      #D93A5A;  /* rose     */

  /* Track behind each ring — the unfilled portion. */
  --ring-track: rgba(60, 60, 67, 0.14);

  /* --- Brand accent ------------------------------------------------------
     Jade, same family as protein: protein is the metric this app exists for.
     --accent      : tint for icons, links, active tab, chart lines
     --accent-fill : darker step used as a button background behind white
                     text, so the label clears contrast.                    */
  --accent: #00996F;
  --accent-fill: #007D5A;
  --accent-wash: rgba(0, 153, 111, 0.12);

  /* --- Semantic status (reserved — never reused as a 5th macro colour) --- */
  --ok: #00996F;
  --warn: #C97C05;
  --bad: #D93A5A;

  /* --- Surfaces & ink (light) ------------------------------------------- */
  --bg: #F2F2F7;          /* app background, iOS grouped-table grey */
  --card: #FFFFFF;        /* raised card */
  --card-2: #F7F7FA;      /* inset row inside a card */
  --ink: #1C1C1E;         /* primary text */
  --ink-2: #6E6E73;       /* secondary text */
  --ink-3: #A1A1A6;       /* tertiary / placeholder */
  --hairline: rgba(60, 60, 67, 0.13);
  --chrome: rgba(249, 249, 252, 0.82);   /* nav bar behind backdrop-blur */
  --press: rgba(60, 60, 67, 0.08);       /* tap highlight */
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);

  /* --- Type --------------------------------------------------------------
     System stack only. A webfont would cost a network round-trip on an app
     whose whole point is opening instantly offline.                        */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;

  --t-display: 2.75rem;   /* 44px — the one big number per screen */
  --t-title:   1.75rem;   /* 28px — screen title */
  --t-h1:      1.3125rem; /* 21px — card heading */
  --t-h2:      1.0625rem; /* 17px — row title */
  --t-body:    1.0625rem; /* 17px */
  --t-sub:     0.9375rem; /* 15px */
  --t-cap:     0.8125rem; /* 13px */
  --t-micro:   0.6875rem; /* 11px */

  /* --- Space (4px grid) -------------------------------------------------- */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;

  /* --- Radii -------------------------------------------------------------
     Deliberately not one value on everything: bigger containers get bigger
     corners, which is what makes the nesting read correctly.               */
  --r-card: 20px;
  --r-row: 14px;
  --r-btn: 14px;
  --r-pill: 999px;

  /* --- Motion ------------------------------------------------------------ */
  --ease: cubic-bezier(0.32, 0.72, 0, 1);  /* iOS-ish: fast out, long settle */
  --dur: 380ms;
  --dur-fast: 180ms;

  /* Height of the tab bar, excluding the home-indicator inset. */
  --tabbar-h: 54px;
}

/* --- Dark mode -------------------------------------------------------------
   Selected, not auto-inverted. Surfaces come from the iOS dark elevation
   scale (#000 base, #1C1C1E card, #2C2C2E inset). The macro hues are
   unchanged because they were validated against #1C1C1E too.

   js/ui/theme.js always resolves settings.theme (system|light|dark) into a
   concrete data-theme attribute on <html>, so there is no prefers-color-scheme
   query here — the in-app switch takes effect on the same frame.          */
:root[data-theme="dark"] {
  color-scheme: dark;

  --ring-track: rgba(120, 120, 128, 0.24);

  --accent: #00C08B;
  --accent-fill: #00A376;
  --accent-wash: rgba(0, 192, 139, 0.16);

  --bg: #000000;
  --card: #1C1C1E;
  --card-2: #2C2C2E;
  --ink: #F5F5F7;
  --ink-2: #98989D;
  --ink-3: #6E6E73;
  --hairline: rgba(84, 84, 88, 0.42);
  --chrome: rgba(22, 22, 24, 0.80);
  --press: rgba(235, 235, 245, 0.10);
  --shadow-card: none;
}


/* ============================================================================
   base.css — reset, document shell, typography primitives, utilities.
   ========================================================================= */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

html {
  background: var(--bg);
  /* Keeps the rubber-band overscroll area the right colour on iOS. */
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  font-size: var(--t-body);
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  /* Standalone apps shouldn't feel like a web page: no text selection on
     chrome, no long-press callout, no blue tap flash. */
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

/* Inputs and editable areas opt selection back in. */
input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }

h1, h2, h3, h4, p { margin: 0; }
button { font: inherit; color: inherit; }

/* --- App shell -------------------------------------------------------------
   #app scrolls; the tab bar is fixed on top of it. Bottom padding clears
   both the bar and the iPhone home indicator.                              */
.app {
  min-height: 100%;
  padding:
    calc(env(safe-area-inset-top) + var(--s-3))
    max(env(safe-area-inset-right), var(--s-4))
    calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--s-8))
    max(env(safe-area-inset-left), var(--s-4));
  max-width: 560px;   /* stays phone-shaped on an iPad or desktop window */
  margin-inline: auto;
}

/* --- Type primitives ------------------------------------------------------ */

/* The one big number on a screen. Tabular figures so digits don't shuffle
   horizontally while a value animates. */
.display {
  font-size: var(--t-display);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.screen-title {
  font-size: var(--t-title);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.card-title {
  font-size: var(--t-h1);
  font-weight: 650;
  letter-spacing: -0.015em;
}

.sub { font-size: var(--t-sub); color: var(--ink-2); }
.cap { font-size: var(--t-cap); color: var(--ink-2); }
.micro { font-size: var(--t-micro); color: var(--ink-3); }

/* Any element showing a number gets aligned digits. */
.num { font-variant-numeric: tabular-nums; }

/* --- Utilities ------------------------------------------------------------ */
.row { display: flex; align-items: center; gap: var(--s-3); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.stack { display: flex; flex-direction: column; }
.grow { flex: 1 1 auto; min-width: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }

/* Visible only to screen readers. */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* --- Focus ----------------------------------------------------------------
   Keyboard focus must stay visible even though tap highlight is off. */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--s-2);
}

/* --- Reduced motion -------------------------------------------------------
   Honour the OS switch: kill transitions rather than shorten them. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}


/* ============================================================================
   components.css — reusable pieces: cards, buttons, steppers, rings, tab bar,
   toasts, sheets, form controls.
   ========================================================================= */

/* ---------------------------------------------------------------- Card ---- */
.card {
  background: var(--card);
  border-radius: var(--r-card);
  padding: var(--s-5);
  box-shadow: var(--shadow-card);
  margin-bottom: var(--s-4);
}
.card--flush { padding: 0; overflow: hidden; }

.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-3);
  margin-bottom: var(--s-4);
}

/* Inset row list inside a flush card (Settings, History). */
.list { display: flex; flex-direction: column; }
.list-row {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-height: 52px;
  padding: var(--s-3) var(--s-5);
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  color: inherit;
}
.list-row + .list-row { box-shadow: inset 0 0.5px 0 var(--hairline); }
.list-row--tap { cursor: pointer; }
.list-row--tap:active { background: var(--press); }
.list-row__chevron { color: var(--ink-3); flex: none; }

/* -------------------------------------------------------------- Buttons --- */
.btn {
  appearance: none;
  border: none;
  border-radius: var(--r-btn);
  padding: 14px var(--s-5);
  font-size: var(--t-body);
  font-weight: 600;
  letter-spacing: -0.01em;
  background: var(--card-2);
  color: var(--ink);
  cursor: pointer;
  min-height: 48px;                 /* comfortable thumb target */
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.btn:active { transform: scale(0.97); }
.btn--primary { background: var(--accent-fill); color: #fff; }
.btn--quiet { background: transparent; color: var(--accent); }
.btn--danger { background: transparent; color: var(--bad); }
.btn--block { width: 100%; }

/* ============================================================================
   screens.css — layout specific to one screen. Anything reusable belongs in
   components.css instead.
   ========================================================================= */

/* Shared screen header: title on the left, contextual action on the right. */
.screen-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--s-3);
  margin: var(--s-2) var(--s-1) var(--s-5);
}
.log-date-field { width: min(220px, 100%); margin: var(--s-3) 0 0; }

/* Author credit under the app title. Tertiary ink and micro size so it
   reads as a signature rather than a subheading. */
.byline {
  font-size: var(--t-micro);
  color: var(--ink-3);
  letter-spacing: 0.01em;
  margin-top: 3px;
}

/* ====================================================== Dashboard ========= */

/* The hero. One large calorie ring with the headline number inside it;
   the three macro rings sit underneath, quiet, in the same card. */
.hero { text-align: center; padding-top: var(--s-6); }

.hero__center-value { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em; }
.hero__center-unit { font-size: var(--t-cap); color: var(--ink-2); margin-top: 4px; }

.hero__eaten {
  margin-top: var(--s-4);
  font-size: var(--t-sub);
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.hero__macros {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s-3);
  margin-top: var(--s-6);
  padding-top: var(--s-5);
  border-top: 0.5px solid var(--hairline);
}

/* Weight / Steps / Streak — three quiet stat tiles. */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); }
.stat {
  background: var(--card);
  border-radius: var(--r-card);
  padding: var(--s-4);
  box-shadow: var(--shadow-card);
  text-align: left;
  border: none; color: inherit; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease);
}
.stat:active { transform: scale(0.97); }
.stat__label { font-size: var(--t-micro); color: var(--ink-2); margin-bottom: var(--s-2); }
.stat__value { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat__unit { font-size: var(--t-cap); font-weight: 500; color: var(--ink-2); margin-left: 2px; }

/* AI Coach insights. A left rule in the accent colour rather than a boxed
   card, so it reads as commentary on the numbers above, not another metric. */
.insight { display: flex; gap: var(--s-3); padding: var(--s-3) 0; }
.insight + .insight { box-shadow: inset 0 0.5px 0 var(--hairline); }
.insight__mark { width: 3px; border-radius: 2px; flex: none; background: var(--accent); }
.insight__mark--warn { background: var(--warn); }
.insight__mark--bad { background: var(--bad); }
.insight__text { font-size: var(--t-sub); line-height: 1.4; }
.insight__text b { font-weight: 650; }

/* ======================================================= Log Food ========= */

.log-section-label {
  font-size: var(--t-cap);
  font-weight: 600;
  color: var(--ink-2);
  margin: var(--s-6) var(--s-1) var(--s-3);
}
.log-section-label:first-of-type { margin-top: var(--s-2); }

/* Running total pinned under the header so totals update in view while you
   tap. Not sticky-fixed — it scrolls with the page, which keeps the grid
   the full height of the screen. */
.log-total {
  display: flex; align-items: baseline; gap: var(--s-2);
  padding: var(--s-4) var(--s-5);
  background: var(--card);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-card);
  margin-bottom: var(--s-2);
}
.log-total__kcal { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.log-total__macros { font-size: var(--t-cap); color: var(--ink-2); font-variant-numeric: tabular-nums; margin-left: auto; }

/* Today's logged entries, each with its own stepper. */
.entry-row {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-5);
  min-height: 56px;
}
.entry-row + .entry-row { box-shadow: inset 0 0.5px 0 var(--hairline); }
.entry-row__emoji { font-size: 20px; flex: none; }
.entry-row__name { font-size: var(--t-h2); font-weight: 550; letter-spacing: -0.01em; }
.entry-row__macro { font-size: var(--t-micro); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ======================================================= History ========== */

.history-day {
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-5);
  width: 100%; border: none; background: none; color: inherit;
  text-align: left; cursor: pointer;
}
.history-day + .history-day { box-shadow: inset 0 0.5px 0 var(--hairline); }
.history-day:active { background: var(--press); }
.history-day__date { width: 52px; flex: none; }
.history-day__dow { font-size: var(--t-micro); color: var(--ink-2); }
.history-day__dom { font-size: var(--t-h1); font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.history-day__kcal { font-size: var(--t-h2); font-weight: 600; font-variant-numeric: tabular-nums; }
.history-day__macros { font-size: var(--t-micro); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Four hairline bars showing goal attainment for the day at a glance. */
.day-bars { display: flex; gap: 3px; width: 44px; flex: none; }
.day-bar { flex: 1; height: 28px; border-radius: 2px; background: var(--ring-track); position: relative; overflow: hidden; }
.day-bar__fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 2px; }

/* Expanded detail under a tapped day. */
.history-detail { padding: 0 var(--s-5) var(--s-4); }
.history-detail__item {
  display: flex; justify-content: space-between; gap: var(--s-3);
  font-size: var(--t-sub); padding: 5px 0; color: var(--ink-2);
}
.history-detail__item span:first-child { color: var(--ink); }

/* ======================================================== Weight ========== */

.weight-hero { display: flex; align-items: flex-end; gap: var(--s-3); margin-bottom: var(--s-5); }
.weight-hero__unit { font-size: var(--t-h1); color: var(--ink-2); font-weight: 600; padding-bottom: 6px; }

.delta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s-3); margin-top: var(--s-5); }
.delta {
  background: var(--card-2);
  border-radius: var(--r-row);
  padding: var(--s-3) var(--s-4);
}
.delta__label { font-size: var(--t-micro); color: var(--ink-2); }
.delta__value { font-size: var(--t-h1); font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.delta__value--down { color: var(--ok); }
.delta__value--up { color: var(--bad); }

.chart-wrap { position: relative; margin-top: var(--s-2); }

/* ======================================================= Settings ========= */

.settings-group-label {
  font-size: var(--t-cap);
  color: var(--ink-2);
  font-weight: 500;
  margin: var(--s-6) var(--s-5) var(--s-2);
}
.settings-group-label:first-of-type { margin-top: var(--s-2); }

.food-edit-row {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-5);
  width: 100%; border: none; background: none; color: inherit;
  text-align: left; cursor: pointer; min-height: 56px;
}
.food-edit-row + .food-edit-row { box-shadow: inset 0 0.5px 0 var(--hairline); }
.food-edit-row:active { background: var(--press); }
.food-edit-row__macros { font-size: var(--t-micro); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Marks a food whose numbers are our seeded estimate, not something the
   user has confirmed. Disappears the moment they save an edit. */
.badge-est {
  font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
  padding: 2px 5px; border-radius: 4px;
  background: var(--card-2); color: var(--ink-3);
  flex: none;
}

.toggle {
  position: relative; width: 51px; height: 31px; flex: none;
  border: none; border-radius: var(--r-pill);
  background: var(--ring-track); cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.toggle[aria-pressed="true"] { background: var(--accent-fill); }
.toggle::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2);
  transition: transform var(--dur-fast) var(--ease);
}
.toggle[aria-pressed="true"]::after { transform: translateX(20px); }

</style>

<body>
<main id="app" class="app" role="main"></main>
<nav id="tabbar" class="tabbar" role="navigation" aria-label="Main"></nav>
<div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
<div id="sheet-root"></div>

<script>
/*!
 * MacroTrack AI — single-file build.
 *
 * Generated by tools/build-single.js from the modular source. Each original
 * ES module is an IIFE below, in dependency order, keeping its own scope.
 *
 * A plain (non-module) script on purpose: inline module scripts are still
 * subject to CORS, so this is what lets the file work when opened directly
 * from disk with no server.
 */
(function () {
  'use strict';

  /* ============================================================
     js/core/dates.js
     ============================================================ */
  const { dayKey, fromKey, addDays, daysBetween, lastNDays, isToday, weekday, isWeekend, shortDow, dayOfMonth, shortDate, friendlyDate } = (() => {
    /**
     * dates.js — every date in this app is keyed by a local "YYYY-MM-DD" string.
     *
     * Why not ISO timestamps or UTC? A food log is a *calendar* record: something
     * eaten at 11pm belongs to that day in the user's own timezone, not to
     * tomorrow in UTC. Keying on the local calendar date keeps that correct and
     * makes day lookups a plain object index.
     */

    /** Local date key for a Date (defaults to now). @returns {string} "YYYY-MM-DD" */
    function dayKey(date = new Date()) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    /** Parse a day key back into a local Date at midnight. */
    function fromKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    /** Shift a day key by n days (negative goes back). */
    function addDays(key, n) {
      const d = fromKey(key);
      d.setDate(d.getDate() + n);
      return dayKey(d);
    }

    /** Whole days between two keys (b - a). */
    function daysBetween(a, b) {
      return Math.round((fromKey(b) - fromKey(a)) / 86_400_000);
    }

    /** The last `n` day keys ending at `endKey`, oldest first. */
    function lastNDays(n, endKey = dayKey()) {
      return Array.from({ length: n }, (_, i) => addDays(endKey, i - (n - 1)));
    }

    const isToday = (key) => key === dayKey();

    /** 0 = Sunday … 6 = Saturday */
    const weekday = (key) => fromKey(key).getDay();
    const isWeekend = (key) => weekday(key) === 0 || weekday(key) === 6;

    const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    const shortDow = (key) => DOW[weekday(key)];
    const dayOfMonth = (key) => fromKey(key).getDate();

    /** "Sep 27" — the format used in the history list. */
    const shortDate = (key) => `${MON[fromKey(key).getMonth()]} ${dayOfMonth(key)}`;

    /** "Today" / "Yesterday" / "Sat, Sep 27" — used in screen headers. */
    function friendlyDate(key) {
      const today = dayKey();
      if (key === today) return 'Today';
      if (key === addDays(today, -1)) return 'Yesterday';
      return `${shortDow(key)}, ${shortDate(key)}`;
    }
    return { dayKey, fromKey, addDays, daysBetween, lastNDays, isToday, weekday, isWeekend, shortDow, dayOfMonth, shortDate, friendlyDate };
  })();

  /* ============================================================
     js/core/dom.js
     ============================================================ */
  const { el, svgEl, mount, int, grams, kg, signed, tapFeedback, uid } = (() => {
    /**
     * dom.js — a ~40 line element builder, used instead of a framework.
     *
     * The app is small enough that full re-render of one screen on change is
     * cheaper (in code and in bytes) than a virtual DOM. `el()` keeps that
     * readable without string-concatenating HTML, which also means we never
     * interpolate user text into markup.
     */

    /**
     * Build an element.
     *   el('div.card', { onclick: fn }, 'text', childEl)
     * Tag syntax supports `tag.class.class` and a bare `.class` (implies div).
     *
     * Attribute keys:
     *   on*        -> addEventListener
     *   style      -> object of CSS properties (supports --custom-props)
     *   dataset    -> object of data-* values
     *   class      -> extra class names, merged with those in the tag string
     *   anything else -> setAttribute, except `value`/`checked` which are props
     */
    function el(spec, attrs = {}, ...children) {
      const [tag, ...classes] = spec.split('.');
      const node = document.createElement(tag || 'div');
      if (classes.length) node.className = classes.join(' ');

      for (const [key, value] of Object.entries(attrs || {})) {
        if (value === null || value === undefined || value === false) continue;

        if (key.startsWith('on') && typeof value === 'function') {
          node.addEventListener(key.slice(2), value);
        } else if (key === 'style' && typeof value === 'object') {
          for (const [prop, v] of Object.entries(value)) {
            if (prop.startsWith('--')) node.style.setProperty(prop, v);
            else node.style[prop] = v;
          }
        } else if (key === 'dataset') {
          Object.assign(node.dataset, value);
        } else if (key === 'class') {
          node.className = [node.className, value].filter(Boolean).join(' ');
        } else if (key === 'value' || key === 'checked') {
          node[key] = value;
        } else {
          node.setAttribute(key, value === true ? '' : value);
        }
      }

      append(node, children);
      return node;
    }

    /** Append strings, nodes, arrays and nested arrays; ignore null/false. */
    function append(node, children) {
      for (const child of children) {
        if (child === null || child === undefined || child === false) continue;
        if (Array.isArray(child)) append(node, child);
        else node.append(child instanceof Node ? child : document.createTextNode(String(child)));
      }
    }

    /** Build an inline SVG element (needs the SVG namespace, so not el()). */
    function svgEl(tag, attrs = {}, ...children) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (value === null || value === undefined || value === false) continue;
        if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2), value);
        else node.setAttribute(key, value);
      }
      for (const child of children.flat()) {
        if (child) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
      }
      return node;
    }

    /** Replace all children of `parent` with `content`. */
    function mount(parent, content) {
      parent.replaceChildren();
      append(parent, [content]);
      return parent;
    }

    /* --- Number formatting ---------------------------------------------------
       One place decides how numbers are shown, so a value never appears as
       "12.000000001 g" in one screen and "12 g" in another.                    */

    /** Whole numbers for calories and steps. */
    const int = (n) => Math.round(Number(n) || 0).toLocaleString();

    /** Grams: no decimal unless the value is small enough to need one. */
    function grams(n) {
      const v = Number(n) || 0;
      return v >= 10 || v === 0 ? String(Math.round(v)) : String(Math.round(v * 10) / 10);
    }

    /** Weight, always one decimal ("72.4"). */
    const kg = (n) => (Number(n) || 0).toFixed(1);

    /** Signed delta with one decimal ("+0.4" / "−0.8"). Uses a real minus sign. */
    function signed(n, digits = 1) {
      const v = Number(n) || 0;
      const abs = Math.abs(v).toFixed(digits);
      if (v > 0) return `+${abs}`;
      if (v < 0) return `−${abs}`;
      return abs;
    }

    /** Light haptic feedback where the platform supports it. */
    function tapFeedback() {
      if (navigator.vibrate) navigator.vibrate(8);
    }
    /**
     * A unique id for a log entry, food or template.
     *
     * `crypto.randomUUID()` only exists in a **secure context** — HTTPS or
     * localhost. Served from a plain LAN address (http://192.168.1.x:8765, which
     * is exactly how you'd reach this from a phone on the same Wi-Fi) it is
     * `undefined`, and calling it throws, so every tap on a food silently fails.
     *
     * These ids are local row keys, not security tokens: they only have to be
     * unique within one device's localStorage. So the fallback pairs a timestamp
     * with randomness, which is collision-free for this purpose without needing
     * the crypto API at all.
     */
    function uid() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    }
    return { el, svgEl, mount, int, grams, kg, signed, tapFeedback, uid };
  })();

  /* ============================================================
     js/data/defaultFoods.js
     ============================================================ */
  const { DEFAULT_FOODS, DEFAULT_TEMPLATES } = (() => {
    /**
     * defaultFoods.js — the seed food database.
     *
     * Every food carries the macros for ONE serving. Logging is then just
     * "food + quantity", and the quantity stepper covers everything else — no
     * portion picker between you and a tap.
     *
     * `estimated: true` marks a value we seeded from standard composition tables
     * rather than from the user's own packaging. Those rows show an "EST" badge
     * in Settings until the user saves an edit, which clears the flag. This is
     * honesty about data provenance, not a nag.
     *
     * Macro figures are internally consistent: 4 kcal/g protein, 4 kcal/g carb,
     * 9 kcal/g fat reconstructs the stated calories to within rounding.
     */

    /**
     * @typedef {Object} Food
     * @property {string}  id        stable key referenced by log entries & templates
     * @property {string}  name
     * @property {string}  emoji
     * @property {string}  serving   human-readable serving description
     * @property {number}  calories  kcal per serving
     * @property {number}  protein   g per serving
     * @property {number}  carbs     g per serving
     * @property {number}  fat       g per serving
     * @property {boolean} estimated true until the user confirms the numbers
     * @property {boolean} [pinned]  show on the Log screen's quick grid
     */

    /** @type {Food[]} */
    const DEFAULT_FOODS = [
      {
        id: 'milk',
        name: 'Akshayakalpa Milk',
        emoji: '🥛',
        serving: '250 g',
        // Calories and protein are the user's own figures for their carton.
        // Carbs and fat are back-solved so the macros reconstruct 170 kcal.
        calories: 170, protein: 25, carbs: 12, fat: 2.5,
        estimated: false,
        pinned: true,
      },
      {
        id: 'curd',
        name: 'Curd',
        emoji: '🥣',
        serving: '100 g',
        calories: 61, protein: 3.5, carbs: 4.7, fat: 3.3,
        estimated: true,
        pinned: true,
      },
      {
        id: 'egg',
        name: 'Egg',
        emoji: '🥚',
        serving: '1 large (50 g)',
        calories: 78, protein: 6.3, carbs: 0.6, fat: 5.3,
        estimated: true,
        pinned: true,
      },
      {
        id: 'chapati',
        name: 'Chapati',
        emoji: '🫓',
        serving: '1 (40 g)',
        calories: 104, protein: 3.1, carbs: 18, fat: 2.5,
        estimated: true,
        pinned: true,
      },
      {
        id: 'dosa',
        name: 'Dosa',
        emoji: '🥞',
        serving: '1 plain (80 g)',
        calories: 133, protein: 2.7, carbs: 24, fat: 3,
        estimated: true,
        pinned: true,
      },
      {
        id: 'ragi-dosa',
        name: 'Ragi Dosa',
        emoji: '🌾',
        serving: '1 (80 g)',
        calories: 120, protein: 3, carbs: 21, fat: 2.5,
        estimated: true,
        pinned: true,
      },
      {
        id: 'chicken',
        name: 'Chicken',
        emoji: '🍗',
        serving: '100 g cooked',
        calories: 165, protein: 31, carbs: 0, fat: 3.6,
        estimated: true,
        pinned: true,
      },
      {
        id: 'paneer',
        name: 'Paneer',
        emoji: '🧀',
        serving: '100 g',
        calories: 265, protein: 18.3, carbs: 1.2, fat: 20.8,
        estimated: true,
        pinned: true,
      },
      {
        id: 'coffee',
        name: 'Coffee',
        emoji: '☕',
        serving: '1 cup with milk',
        calories: 60, protein: 2, carbs: 8, fat: 2,
        estimated: true,
        pinned: true,
      },
      {
        id: 'ragi-laddu',
        name: 'Ragi Laddu',
        emoji: '🍪',
        serving: '1 (35 g)',
        calories: 150, protein: 2.5, carbs: 20, fat: 6.5,
        estimated: true,
        pinned: false,
      },
      {
        id: 'whey',
        name: 'Whey Protein',
        emoji: '🥤',
        serving: '1 scoop (30 g)',
        calories: 120, protein: 24, carbs: 3, fat: 1.5,
        estimated: true,
        pinned: true,
      },
      {
        id: 'fruit',
        name: 'Fruit',
        emoji: '🍎',
        serving: '1 serving (~120 g)',
        calories: 92, protein: 1, carbs: 22, fat: 0.3,
        estimated: true,
        pinned: true,
      },
    ];

    /**
     * Seed meal templates. A template is a named bundle of {foodId, qty} that
     * logs in one tap — the fastest path for someone eating the same breakfast
     * every day.
     */
    const DEFAULT_TEMPLATES = [
      {
        id: 'tpl-breakfast',
        name: 'Breakfast',
        emoji: '🌅',
        items: [
          { foodId: 'egg', qty: 3 },
          { foodId: 'coffee', qty: 1 },
          { foodId: 'milk', qty: 1 },
        ],
      },
      {
        id: 'tpl-lunch',
        name: 'Lunch',
        emoji: '🍽️',
        items: [
          { foodId: 'chicken', qty: 1 },
          { foodId: 'chapati', qty: 2 },
        ],
      },
      {
        id: 'tpl-dinner',
        name: 'Dinner',
        emoji: '🌙',
        items: [
          { foodId: 'paneer', qty: 1 },
          { foodId: 'chapati', qty: 2 },
        ],
      },
    ];
    return { DEFAULT_FOODS, DEFAULT_TEMPLATES };
  })();

  /* ============================================================
     js/data/defaultSettings.js
     ============================================================ */
  const { DEFAULT_SETTINGS, SCHEMA_VERSION } = (() => {
    /**
     * defaultSettings.js — what a brand-new install starts with.
     * Everything here is editable on the Settings screen.
     */

    const DEFAULT_SETTINGS = {
      goals: {
        calories: 2200,
        protein: 150,
        carbs: 200,
        fat: 70,
        steps: 8000,
      },

      /** 'kg' today. The unit is read everywhere rather than assumed, so adding
       *  'lb' later is a conversion helper plus a segmented control. */
      weightUnit: 'kg',

      /** 'system' | 'light' | 'dark' */
      theme: 'system',

      /**
       * Which provider supplies the daily step count.
       * 'manual' is the only one implemented; see js/integrations/healthProvider.js
       * for the interface an Apple Health bridge would fill in.
       */
      stepSource: 'manual',
    };

    /** Shape written to localStorage on first run. */
    const SCHEMA_VERSION = 1;
    return { DEFAULT_SETTINGS, SCHEMA_VERSION };
  })();

  /* ============================================================
     js/core/storage.js
     ============================================================ */
  const storage = (() => {
    /**
     * storage.js — the only module that touches localStorage.
     *
     * Responsibilities: read, validate, migrate, write. Nothing else in the app
     * knows the storage key or the wire format, so swapping in IndexedDB or a
     * sync backend later is a change to this file alone.
     */
    
    
    /**
     * The localStorage key — the address of the user's data, not a display name.
     * Changing it orphans every logged day, weight and custom food already on the
     * device, silently and with no way back. Leave it alone when renaming things.
     */
    const KEY = 'macrotrack.v1';
    
    /**
     * @typedef {Object} DayRecord
     * @property {Array<{id:string, foodId:string, qty:number, ts:number}>} entries
     * @property {number|null} steps
     * @property {number|null} weight   in the unit stored in settings.weightUnit
     */
    
    /** A fresh, empty database. */
    function freshState() {
      return {
        schemaVersion: SCHEMA_VERSION,
        settings: structuredClone(DEFAULT_SETTINGS),
        foods: structuredClone(DEFAULT_FOODS),
        templates: structuredClone(DEFAULT_TEMPLATES),
        /** @type {Record<string, DayRecord>} keyed by "YYYY-MM-DD" */
        days: {},
      };
    }
    
    /**
     * Load and normalise the database.
     * Any corruption falls back to defaults rather than throwing — a tracker
     * that won't open is worse than a tracker that lost a field.
     */
    function load() {
      let raw;
      try {
        raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      } catch {
        console.warn('[storage] stored JSON was unreadable; starting fresh');
        raw = null;
      }
      if (!raw || typeof raw !== 'object') return freshState();
      return normalise(migrate(raw));
    }
    
    /** Persist. Returns false if the write failed (quota, private mode). */
    function save(state) {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        return true;
      } catch (err) {
        console.error('[storage] save failed', err);
        return false;
      }
    }
    
    /**
     * Apply schema migrations in sequence.
     * Each future version adds one `if (raw.schemaVersion < N)` block that
     * upgrades in place and bumps the number. Keeping them additive means a user
     * who skipped three releases still lands on the current shape.
     */
    function migrate(raw) {
      // v1 is the initial schema — nothing to migrate yet.
      if (!raw.schemaVersion) raw.schemaVersion = SCHEMA_VERSION;
      return raw;
    }
    
    /**
     * Fill in anything missing so screens can read fields without guarding.
     * This also folds in newly shipped default foods: if a later release adds a
     * food, existing users get it without losing their own edits or additions.
     */
    function normalise(raw) {
      const state = freshState();
    
      state.schemaVersion = raw.schemaVersion ?? SCHEMA_VERSION;
    
      state.settings = {
        ...state.settings,
        ...(raw.settings || {}),
        goals: { ...state.settings.goals, ...(raw.settings?.goals || {}) },
      };
    
      if (Array.isArray(raw.foods) && raw.foods.length) {
        const stored = new Map(raw.foods.map((f) => [f.id, f]));
        // Seeds the user hasn't seen yet, appended; their versions win.
        const missingSeeds = DEFAULT_FOODS.filter((f) => !stored.has(f.id));
        state.foods = [...raw.foods.map(cleanFood), ...structuredClone(missingSeeds)];

     * latest-minus-previous number is mostly noise. Deltas here compare
     * *averages* of the period boundaries, which is what actually tells you
     * whether the trend is moving.

     * Every recorded weigh-in, oldest first.

     * within a tolerance when that window is empty.
     *
     * The fallback matters: requiring a reading in the last 3 days meant anyone
     * who weighs in weekly — a very common habit — saw "—" on both deltas
     * forever, with the dashboard printing "Tap to add" directly underneath
     * their actual current weight.
     *
     * Still returns null rather than a misleading number when the two ends would
     * resolve to readings too close together to represent the period at all.

     */

      // The coach separately nags about weigh-ins older than a week.
      const recent = resolvePoint(all, today, 10);
      if (!recent) return null;

      // Candidates for the far end: old enough to actually represent "`days`
      // ago", but not so old that a monthly figure gets built from half a year
      // back. Picking by proximity to the anchor date alone is not enough — for
      // a Monday-only weigher checking on Sunday, the nearest reading to
      // `today - 7` IS the recent reading, which would compare it to itself.
      const minGap = Math.max(2, days / 2);
      const maxGap = days * 2.5;
      const older = all.filter((p) => {
        const gap = daysBetween(p.key, recent.key);
        return gap >= minGap && gap <= maxGap;
      });
      if (!older.length) return null;

      const anchor = addDays(today, -days);
      const distance = (p) => Math.abs(daysBetween(p.key, anchor));
      const nearest = older.reduce((best, p) => (distance(p) < distance(best) ? p : best));

      // Smooth the far end the same way as the near end, using only readings
      // that still belong to that end of the period.
      const window = older.filter((p) => Math.abs(daysBetween(p.key, nearest.key)) <= 2);
      const past = window.reduce((sum, p) => sum + p.value, 0) / window.length;

     * Resolve an anchor date to a representative weight.
     * Prefers a local mean (±2 days) to damp daily water swings; otherwise takes
     * the single nearest reading within `tolerance` days.

      const near = all.filter((p) => Math.abs(daysBetween(p.key, anchor)) <= 2);
